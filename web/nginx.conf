# Oberfläche (index.html, static/) ausliefern und /api/ sowie /files/ an das Backend weiterreichen.
# Die Seite spricht dadurch mit derselben Adresse (const API = "" in index.html), kein CORS nötig.
# Anmeldung: /api/ und /files/ prüft das Backend selbst; /zert/ prüft nginx beim Backend
# (auth_request), denn der Zertifikatsserver hat keine eigene Anmeldung (web/README.md).

server {
    listen 80;
    server_name _;

    root /srv/web;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker-DNS; mit Variable löst nginx den Namen bei Bedarf auf und startet auch,
    # wenn das Backend noch nicht läuft (oder nach einem Neustart eine neue Adresse hat)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;
    set $zertifikatsserver http://zertifikatsserver:5100;

    # Für alle Weiterleitungen: Excel-Stücklisten und PDF-Zertifikate hochladen,
    # Suche und Export dürfen Minuten dauern
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_request_buffering off;

    # Backend weg oder zu langsam: Fehler im Format, das die Seite anzeigt
    error_page 502 503 504 = @backend_weg;

    location = / {
        try_files /index.html =404;
        # Neue Fassung der Seite sofort sichtbar
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        expires 1d;
    }

    location /api/ {
        proxy_pass $backend;
    }

    # PDFs aus dem Ex-Ordner für die Vorschau
    location /files/ {
        proxy_pass $backend;
    }

    # Module der Oberfläche: je Funktion eine Datei (seiten/*.js), siehe README.md
    location /seiten/ {
        add_header Cache-Control "no-cache";
    }

    # Anmeldung für /zert/: fragt das Backend mit dem Cookie der Anfrage, ohne deren Körper.
    # 204 = weiter (Name im Kopf X-Anwender-Name, URL-kodiert), 401 = nicht angemeldet,
    # 403 = Rolle „Leser“ und die Anfrage will schreiben (Methode in X-Original-Method).
    location = /_anmeldung {
        internal;
        proxy_pass $backend/api/auth/pruefe;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Zertifikatsserver: /zert/api/... -> zertifikatsserver:5100/api/..., nur angemeldet.
    # Der Name des Angemeldeten geht im Kopf X-Anwender mit (URL-kodiert, ersetzt jeden Kopf
    # gleichen Namens vom Browser); der Server nimmt ihn vor „von“ im Körper.
    location /zert/ {
        auth_request /_anmeldung;
        auth_request_set $anwender $upstream_http_x_anwender_name;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Anwender $anwender;
        error_page 401 = @nicht_angemeldet;
        error_page 403 = @nur_lesen;
        # 500: die Prüfung selbst ging schief (Backend weg); 502 bis 504: Zertifikatsserver weg
        error_page 500 = @backend_weg;
        error_page 502 503 504 = @zert_weg;
        rewrite ^/zert/(.*)$ /$1 break;
        proxy_pass $zertifikatsserver;
    }

    location @backend_weg {
        default_type application/json;
        return 502 '{"fehler": "Der ATEX-Agent ist gerade nicht erreichbar. Bitte versuchen Sie es in ein paar Minuten noch einmal.", "error": "Der ATEX-Agent ist gerade nicht erreichbar. Bitte versuchen Sie es in ein paar Minuten noch einmal."}';
    }

    location @zert_weg {
        default_type application/json;
        return 502 '{"fehler": "Das Dokumentenarchiv ist gerade nicht erreichbar. Bitte versuchen Sie es in ein paar Minuten noch einmal.", "error": "Das Dokumentenarchiv ist gerade nicht erreichbar. Bitte versuchen Sie es in ein paar Minuten noch einmal."}';
    }

    # Texte wie in backend/app/auth.py (NICHT_ANGEMELDET, NUR_LESEN)
    location @nicht_angemeldet {
        default_type application/json;
        return 401 '{"fehler": "Sie sind nicht angemeldet. Bitte melden Sie sich an.", "error": "Sie sind nicht angemeldet. Bitte melden Sie sich an."}';
    }

    location @nur_lesen {
        default_type application/json;
        return 403 '{"fehler": "Mit Ihrem Zugang können Sie nur ansehen, nichts ändern. Wenn Sie mehr dürfen sollen, wenden Sie sich an die Administration.", "error": "Mit Ihrem Zugang können Sie nur ansehen, nichts ändern. Wenn Sie mehr dürfen sollen, wenden Sie sich an die Administration."}';
    }

    # Sonst nichts ausliefern (nginx.conf, README.md liegen im selben Ordner)
    location / {
        return 404;
    }
}
