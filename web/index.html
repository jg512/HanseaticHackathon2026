<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATEX Agent</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23282828'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='19' font-weight='800' fill='%23fff'%3EA%3C/text%3E%3C/svg%3E">
<!--
  Oberflaeche fuer den Zertifikats-Agenten. Eine Datei, kein Build.
  Spricht mit dem Backend ueber /api/... (Vertrag in docs/api.md, Abschnitt "Vertrag der Oberfläche").
  Ausgeliefert vom Dienst "web" (nginx, web/nginx.conf), der /api/ und /files/ an das Backend reicht.
  Gestaltung nach dem Entwurf aus dem Team, angepasst: Texte ohne Attrappe, eigene Farben.
  Gestaltung angelehnt an die Admin-Dashboard-Vorlage des Teams (Seitenleiste,
  Kennzahl-Karten, Diagramme, Ereignis-Spalte rechts).
-->
<style>
/* Formen nach dem Entwurf aus dem Team, Farben und Kontraste in web/README.md. Limette und
   Marken-Grün sind auf Weiß zu hell für Text. */
:root {
  --limette: #bbd03d; --limette-hover: #c5d75a; --limette-hell: #fafde7;
  --gruen-marke: #75aa3b;
  --gruen: #466e1f; --gruen-hell: #eef5e4; --gruen-mittel: #e4efd9;
  --dunkel: #282828;
  --text: #212529; --grau: #5f666d; --linie: #dee2e6; --flaeche: #f8f9fa; --weiss: #fff;
  --rot: #b3261e; --rot-hell: #fbe9e7; --gelb: #8a6100; --gelb-hell: #fff4d6;
  --blau: #1a5fb4; --blau-hell: #e6effa; --orange: #a14a00; --orange-hell: #ffeedd;
  --radius: 10px;
  --schatten: 0 1px 2px rgba(20, 30, 25, .05), 0 4px 14px rgba(20, 30, 25, .05);
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--flaeche); }
h1 { font-size: 21px; margin: 0 0 4px; }
h2 { font-size: 15px; margin: 0 0 12px; }
.grau { color: var(--grau); }
a { color: var(--gruen); }

/* ---------- app-geruest: seitenleiste + topbar ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
aside.leiste { background: var(--weiss); border-right: 1px solid var(--linie); padding: 18px 12px 170px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { display: flex; align-items: center; gap: 11px; padding: 6px 8px 14px; border-bottom: 1px solid var(--linie); margin-bottom: 12px; text-decoration: none; color: inherit; }
/* Bildzeichen: schlichtes Buchstabenzeichen „A“, rechts daneben der Name */
.logo .marke { display: block; width: 38px; height: 38px; flex: none; }
.logo .name { font-weight: 800; font-size: 17px; line-height: 1.1; letter-spacing: .06em; white-space: nowrap; }
.logo .name span { font-weight: 500; color: var(--gruen); margin-left: .32em; letter-spacing: .02em; }
/* ---------- ablauf auf der uebersicht: links agent, rechts mensch, schritte an einer mittellinie ---------- */
.ablauf { position: relative; display: flex; flex-direction: column; gap: 9px; }
.ablauf::before { content: ""; position: absolute; left: calc(50% - 1px); top: 30px; bottom: 16px; width: 2px; background: var(--linie); }
.ab-kopf { display: flex; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--grau); }
.ab-kopf span { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.ab-kopf span:last-child { color: var(--gruen); }
.ab { position: relative; width: calc(50% - 22px); border: 1px solid var(--linie); border-radius: 10px; padding: 7px 10px; background: var(--weiss); font-size: 12.5px; line-height: 1.3; }
.ab b { display: block; font-weight: 600; }
.ab small { display: block; color: var(--grau); font-size: 11.5px; }
.ab.agent { align-self: flex-start; }
.ab.mensch { align-self: flex-end; background: var(--limette-hell); border-color: var(--limette); }
/* strich zur mittellinie und die nummer darauf */
.ab::after { content: ""; position: absolute; top: calc(50% - 1px); width: 13px; height: 2px; background: var(--linie); }
.ab.agent::after { right: -14px; }
.ab.mensch::after { left: -14px; background: var(--limette); }
.ab::before { content: attr(data-nr); position: absolute; top: calc(50% - 9px); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; z-index: 1; background: var(--weiss); border: 2px solid var(--linie); color: var(--grau); box-sizing: border-box; }
.ab.agent::before { right: -31px; }
.ab.mensch::before { left: -31px; background: var(--limette); border-color: var(--limette); color: var(--text); }
.ab .rueck { display: inline-block; margin-top: 5px; padding: 1px 7px; border: 1px dashed var(--grau); border-radius: 99px; font-size: 11px; color: var(--grau); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 500; margin-bottom: 2px; }
.nav a svg { flex: none; color: var(--grau); }
.nav a:hover { background: var(--flaeche); color: var(--text); }
.nav a.an { background: var(--limette-hell); color: var(--text); font-weight: 600; }
.nav .gruppe { font-size: 11px; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; padding: 14px 10px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav .zahl { margin-left: auto; background: var(--orange-hell); color: var(--orange); border-radius: 99px; padding: 0 7px; font-size: 11px; font-weight: 700; }
.leiste .unten { position: absolute; bottom: 10px; left: 12px; right: 12px; }
.profil { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid var(--linie); }
.profil .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--limette); color: var(--text); font-weight: 700; display: grid; place-items: center; font-size: 13.5px; flex: none; }
.profil .wer { font-size: 13px; font-weight: 600; line-height: 1.25; }
.profil .rolle { font-size: 11.5px; color: var(--grau); font-weight: 400; }

/* ---------- anmeldung: login-seite, profil, konto (eigener block) ---------- */
body.startet .app, body.startet .anmeldung { visibility: hidden; }
body.abgemeldet .app { display: none; }
.anmeldung { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.anmeldung[hidden] { display: none; }
.anmelde-karte { width: 100%; max-width: 380px; background: var(--weiss); border: 1px solid var(--linie); border-radius: 12px; padding: 26px 26px 22px; box-shadow: var(--schatten); }
.anmelde-karte .logo { padding: 0 0 16px; margin-bottom: 18px; }
/* Anmeldeseite: Bildzeichen etwas größer, der Name rechts daneben */
.anmelde-karte .logo .marke { width: 44px; height: 44px; }
.anmelde-karte .logo .name { font-size: 18px; line-height: 44px; }
.anmelde-karte h1 { margin-bottom: 2px; }
.anmelde-karte button[type=submit] { width: 100%; margin-top: 16px; padding: 9px 14px; font-weight: 600; }
.anmelde-karte .fehler { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--rot); font-weight: 600; }
.anmelde-karte .fuss { font-size: 12px; color: var(--grau); text-align: center; margin: 14px 0 0; }
input[type=password] { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid #cfd4d1; border-radius: 8px; background: #fff; }
.profil .wer, .profil .rolle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profil > div:nth-child(2) { min-width: 0; flex: 1; }
.profil .avatar svg { display: block; }
.profil .abmelden { flex: none; padding: 4px 6px; }
.konto-feld { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; padding: 6px 0; font-size: 13.5px; }
.konto-feld .grau { font-size: 12.5px; }

.hauptbereich { display: flex; flex-direction: column; min-width: 0; }
.topbar { background: var(--weiss); border-bottom: 1px solid var(--linie); padding: 10px 24px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 5; }
.topbar .suche { position: relative; width: 300px; max-width: 40vw; }
.topbar .suche input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--linie); border-radius: 99px; background: var(--flaeche); font: inherit; }
.topbar .suche svg { position: absolute; left: 11px; top: 9px; color: var(--grau); }
.topbar .rechts { margin-left: auto; display: flex; align-items: center; gap: 12px; }
/* ganze Breite auf jeder Seite: kein leerer Rand rechts neben Tabellen */
main { padding: 22px 24px; width: 100%; }

/* ---------- bausteine ---------- */
.karte { background: var(--weiss); border: 1px solid var(--linie); border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: var(--schatten); }
button, .knopf { font: inherit; border: 1px solid var(--limette); background: var(--limette); color: var(--text); padding: 7px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
button.leise, .knopf.leise { background: #fff; color: var(--dunkel); border-color: var(--dunkel); }
button.gefahr { background: #fff; color: var(--rot); border-color: var(--rot); }
button.icon { background: none; border: none; color: var(--grau); padding: 2px 6px; font-size: 15px; line-height: 1; }
button.icon:hover { color: var(--gruen); background: none; }
button:disabled, .knopf.aus { opacity: .45; cursor: not-allowed; pointer-events: none; }
input[type=text], input[type=email], textarea { font: inherit; width: 100%; padding: 7px 9px; border: 1px solid #cfd4d1; border-radius: 8px; background: #fff; }
textarea { min-height: 170px; resize: vertical; }
label { font-size: 12px; color: var(--grau); display: block; margin: 8px 0 3px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--grau); padding: 8px 10px; border-bottom: 1px solid var(--linie); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--linie); vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.klick { cursor: pointer; }
tbody tr.klick:hover { background: var(--limette-hell); }
tr.korrektur td { background: var(--gelb-hell); }
tr.korrektur input { padding: 4px 6px; font-size: 13px; }
body.kompakt td { padding: 5px 8px; }
body.kompakt th { padding: 6px 8px; }
.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.s-kein_ex { background: #eef0f2; color: var(--grau); }
.s-wartet { background: #eef0f2; color: #343a40; }
.s-info_fehlt, .s-eskaliert { background: var(--rot-hell); color: var(--rot); }
.s-suche { background: var(--blau-hell); color: var(--blau); }
.s-zu_pruefen { background: var(--gelb-hell); color: var(--gelb); }
.s-geprueft, .s-in_db { background: var(--gruen-mittel); color: var(--gruen); }
.s-mail_entwurf, .s-angefordert, .s-erinnert { background: var(--orange-hell); color: var(--orange); }
.punkt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; margin-right: 6px; animation: puls 1s infinite; }
@keyframes puls { 50% { opacity: .25; } }
.raster { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.ablage { border: 2px dashed var(--gruen-mittel); border-radius: 10px; padding: 26px; text-align: center; background: var(--limette-hell); cursor: pointer; }
.ablage.drueber { border-color: var(--gruen); background: var(--gruen-mittel); }
.leiste-balken { height: 8px; border-radius: 4px; background: #e9ecef; overflow: hidden; display: flex; margin-top: 6px; }
.leiste-balken span { display: block; height: 100%; }

/* kennzahl-karten wie in der vorlage */
.statkarten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.statkarte { background: var(--weiss); border: 1px solid var(--linie); border-radius: 12px; padding: 16px 18px; box-shadow: var(--schatten); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.statkarte.klick { cursor: pointer; }
.statkarte.klick:hover { border-color: var(--limette); }
.statkarte .label { font-size: 12.5px; color: var(--grau); margin-bottom: 6px; }
.statkarte .wert { font-size: 24px; font-weight: 700; line-height: 1; }
.blase { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.blase.gruen { background: var(--gruen-hell); color: var(--gruen); }
.blase.gelb { background: var(--gelb-hell); color: var(--gelb); }
.blase.blau { background: var(--blau-hell); color: var(--blau); }
.blase.orange { background: var(--orange-hell); color: var(--orange); }
.blase.rot { background: var(--rot-hell); color: var(--rot); }

/* diagramme auf der uebersicht */
.donut-halter { position: relative; width: 190px; margin: 6px auto 0; }
.donut-halter .mitte { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.donut-halter .mitte .zahl { font-size: 26px; font-weight: 700; line-height: 1.1; }
.donut-halter .mitte .was { font-size: 11.5px; color: var(--grau); }

/* jahres-auswahl auf der projekte-seite */
.jahres-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.jahr-karte { background: var(--weiss); border: 1px solid var(--linie); border-radius: 12px; padding: 20px; box-shadow: var(--schatten); cursor: pointer; }
.jahr-karte:hover { border-color: var(--limette); background: var(--limette-hell); }
.jahr-karte .jahr { font-size: 26px; font-weight: 700; }

.schritte { display: flex; gap: 0; margin: 4px 0 16px; }
.schritt { flex: 1; text-align: center; font-size: 12px; color: var(--grau); position: relative; padding-top: 22px; }
.schritt::before { content: ""; position: absolute; top: 8px; left: 0; right: 0; height: 3px; background: var(--linie); }
.schritt .n { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 19px; height: 19px; border-radius: 50%; background: #fff; border: 2px solid var(--linie); font-size: 11px; line-height: 15px; color: var(--grau); z-index: 1; }
.schritt.fertig::before, .schritt.jetzt::before { background: var(--gruen); }
.schritt.fertig .n { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.schritt.jetzt .n { border-color: var(--limette); color: var(--text); font-weight: 700; background: var(--limette); }
.schritt.jetzt { color: var(--text); font-weight: 600; }

.kopfzeile { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.kopfzeile .rechts { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.filter button { background: #fff; color: var(--text); border: 1px solid var(--linie); padding: 3px 11px; border-radius: 99px; font-size: 12px; }
.filter button.an { border-color: var(--limette); background: var(--limette-hell); color: var(--text); }
.mailfilter { flex-wrap: nowrap; overflow-x: auto; margin-bottom: 10px; }
.mailfilter button { white-space: nowrap; flex: none; padding: 4px 14px; font-size: 13px; }
.sprachwahl label { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 14px; cursor: pointer; }
.sprachwahl input { width: 17px; height: 17px; }
.hinweis { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.hinweis.rot { background: var(--rot-hell); color: #5c120d; }
.hinweis.gruen { background: var(--gruen-hell); color: var(--gruen); }
.feld { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; padding: 7px 0; border-bottom: 1px solid var(--linie); }
.feld:last-child { border-bottom: none; }
.beleg { font-size: 12px; color: var(--grau); }
.unbelegt { font-size: 12px; color: var(--rot); font-weight: 600; }
.fund { border: 1px solid var(--linie); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: #fff; }
.fund.gewaehlt { border-color: var(--gruen-marke); box-shadow: 0 0 0 2px var(--gruen-mittel); }
.fund.zu { padding: 8px 12px; margin-bottom: 8px; }
.fund-kopf { display: flex; align-items: center; gap: 10px; cursor: pointer; border-radius: 6px; }
.fund:not(.zu) > .fund-kopf { margin-bottom: 10px; }
.fund-kopf:focus-visible { outline: 2px solid var(--gruen); outline-offset: 3px; }
.fund-pfeil { color: var(--grau); width: 12px; flex: none; }
.fund-haken { width: 18px; height: 18px; flex: none; cursor: pointer; accent-color: var(--gruen); }
.fund-name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.fund-name strong { font-size: 12.5px; overflow-wrap: anywhere; }
.fund-name .grau { font-size: 12px; }
.fund-marke { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.fund-marke.ok { background: var(--gruen-hell); color: var(--gruen); }
.fund-marke.warnung { background: var(--rot-hell); color: var(--rot); }
.fund-marke.unklar { background: var(--gelb-hell); color: var(--gelb); }
.fund-marke.ohne { background: var(--flaeche); color: var(--grau); }
.zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
iframe.pdf { width: 100%; height: 560px; border: 1px solid var(--linie); border-radius: 8px; margin-top: 8px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dunkel); color: #fff; padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
.toast.an { opacity: .95; }
.tabelle { overflow-x: auto; }
.leer { color: var(--grau); text-align: center; padding: 30px; }

/* Protokoll eines Vorgangs: Blatt von rechts über der Seite, geöffnet mit dem Knopf „Protokoll“;
   die Positionsliste hat so die ganze Breite */
.proto-schleier { position: fixed; inset: 0; background: rgba(20, 30, 25, .35); z-index: 55; display: flex; justify-content: flex-end; }
.proto-schleier[hidden] { display: none; }
.proto-blatt { background: var(--weiss); width: min(480px, 100%); height: 100%; display: flex; flex-direction: column; padding: 18px 20px; box-shadow: -8px 0 30px rgba(0, 0, 0, .18); }
.proto-kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.proto-kopf h2 { margin: 0; }
.proto-blatt .log-scroll { max-height: none; flex: 1; min-height: 0; }
/* Positionen eines Vorgangs: alle Spalten samt „Öffnen“ ohne seitliches Rollen. Köpfe dürfen
   umbrechen („Hersteller-⏎Art.-Nr.“), Typen an Bindestrichen, die Abstände sind etwas enger. */
.pos-liste th { white-space: normal; vertical-align: bottom; }
.pos-liste th, .pos-liste td { padding-left: 7px; padding-right: 7px; }
/* lange Wörter mit Trennstrich, wo der Browser trennen kann, zuletzt auch mitten im Wort, statt
   rechts abzuschneiden */
.pos-liste td { hyphens: auto; overflow-wrap: anywhere; }
.pos-liste td.mono { font-size: 12.5px; }
.pos-liste td:first-child { white-space: nowrap; overflow-wrap: normal; hyphens: none; }
/* gesperrte Zellen ohne graue Ecke: der Mauszeiger und der Hinweis beim Klick genügen */
#app .tg table td.tg-z.tg-zu:not(.tg-still) { background-image: none; }
/* Position: Legende der Markierungen, Entscheidung, Bearbeiten-Dialog */
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--grau); margin: 0 0 10px; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.entscheid { background: var(--flaeche); border-radius: 10px; padding: 12px 14px; }
.pos-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 10px; }
.pos-form label { margin: 0 0 3px; }
.pos-form input { width: 100%; }
.pos-form .breit { grid-column: 1 / -1; }
.pos-folgen { background: var(--gelb-hell); color: #5a4000; border-radius: 8px; padding: 8px 12px; margin-top: 12px; font-size: 13px; }
.pos-folgen[hidden] { display: none; }
.pos-liste .marke-klein { white-space: normal; }
.pos-liste .pos-oeffnen { padding: 3px 8px; white-space: nowrap; }
@media (max-width: 900px) {
  .pos-liste th, .pos-liste td { padding-left: 4px; padding-right: 4px; }
  .pos-liste .pos-oeffnen .pfeil { display: none; }
}
.ereignis { padding: 8px 6px; border-bottom: 1px solid var(--linie); font-size: 12.5px; border-radius: 6px; }
.ereignis:last-child { border-bottom: none; }
.ereignis .zeit { color: var(--grau); font-size: 11.5px; }
.ereignis.klick { cursor: pointer; }
.ereignis.klick:hover { background: var(--limette-hell); }
.log-scroll { max-height: 520px; overflow-y: auto; }

/* e-mail-ansicht wie ein klassisches postfach: links projekte, mitte liste, rechts lesen */
.post { display: grid; grid-template-columns: 190px 280px minmax(0, 1fr); border: 1px solid var(--linie); border-radius: 12px; background: #fff; overflow: hidden; min-height: 72vh; box-shadow: var(--schatten); }
.post .ordner { border-right: 1px solid var(--linie); background: var(--flaeche); padding: 8px 0; overflow-y: auto; }
.post .ordner .titel { font-size: 11px; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .04em; padding: 8px 14px 4px; }
.post .ordner a { display: flex; justify-content: space-between; gap: 8px; padding: 8px 14px; color: var(--text); text-decoration: none; font-size: 13px; }
.post .ordner a:hover { background: #eef0f2; }
.post .ordner a.an { background: var(--limette-hell); color: var(--text); font-weight: 600; box-shadow: inset 3px 0 0 var(--gruen); }
.post .ordner .zahl { background: var(--orange-hell); color: var(--orange); border-radius: 99px; padding: 0 7px; font-size: 11px; font-weight: 700; align-self: center; }
.post .briefe { border-right: 1px solid var(--linie); overflow-y: auto; }
.post .brief { padding: 10px 12px; border-bottom: 1px solid var(--linie); cursor: pointer; }
.post .brief:hover { background: var(--flaeche); }
.post .brief.an { background: var(--limette-hell); box-shadow: inset 3px 0 0 var(--gruen); }
.post .brief .betreff { font-weight: 600; font-size: 13px; margin: 2px 0; }
.post .brief .meta { font-size: 12px; color: var(--grau); }
.post .lesen { padding: 20px 22px; overflow-y: auto; }
.post .lesen .kopf { border-bottom: 1px solid var(--linie); padding-bottom: 12px; margin-bottom: 14px; }
.post .lesen .kopf .feldzeile { display: grid; grid-template-columns: 70px 1fr; gap: 4px 10px; font-size: 13px; padding: 2px 0; }
.post .lesen pre { white-space: pre-wrap; font: inherit; margin: 0; }

@media (max-width: 1100px) { .statkarten { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 1280px) { .post { grid-template-columns: 160px 240px minmax(0, 1fr); } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside.leiste { position: static; height: auto; display: flex; align-items: center; gap: 6px; padding: 8px 12px; }
  .logo { border: none; margin: 0; padding: 0 8px 0 0; } .nav { display: flex; gap: 4px; flex-wrap: wrap; } .nav .gruppe { display: none; }
  /* schmales Fenster: wer angemeldet ist und „Abmelden“ bleiben sichtbar, rechts in der Kopfzeile */
  .leiste .unten { position: static; margin-left: auto; }
  .leiste .unten .profil { border: none; padding: 0 4px; gap: 8px; }
  .leiste .unten .profil .rolle { display: none; }
  .raster { grid-template-columns: 1fr; }
  .post { grid-template-columns: 1fr; min-height: 0; }
  .post .ordner, .post .briefe { border-right: none; border-bottom: 1px solid var(--linie); max-height: 240px; }
}
/* ---------- ergaenzungen zur demo ---------- */
select { font: inherit; padding: 7px 9px; border: 1px solid #cfd4d1; border-radius: 8px; background: #fff; }
:focus-visible { outline: 2px solid var(--gruen); outline-offset: 2px; }
.nav a.an svg { color: var(--gruen); }
button:hover, .knopf:hover { background: var(--limette-hover); border-color: var(--limette-hover); }
button.leise:hover, .knopf.leise:hover { background: var(--dunkel); color: #fff; }
button.gefahr:hover { background: var(--rot-hell); }
.namehinweis { font-size: 12px; margin-left: 4px; }
.namehinweis a { color: inherit; font-weight: 600; }
.filter button:hover { background: var(--flaeche); border-color: #ced4da; }
.hinweis .grund { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
/* ---------- projekte: filter und sortierbare spalten (die tabellen selbst: tabelle.js) ---------- */
.pf-filter { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 6px; }
.pf-filter label { margin: 0 0 3px; }
.pf-filter .pf-text { flex: 1; min-width: 220px; }
.pf-filter .pf-datum { font: inherit; padding: 6px 8px; border: 1px solid #cfd4d1; border-radius: 8px; background: #fff; }
.pf-sort { background: none; border: none; padding: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--grau); cursor: pointer; }
.pf-sort:hover, .pf-sort.an { background: none; color: var(--text); }
.jahr-karte.pf-an { border-color: var(--limette); background: var(--limette-hell); }
#pf-jahre .jahr-karte { padding: 12px 16px; } #pf-jahre .jahr { font-size: 20px; }
/* ---------- neuer vorgang: eine schmale karte, eine zeile; datei auch per ziehen und ablegen ---------- */
.upload { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 16px 18px; border: 2px dashed var(--gruen-mittel); background: var(--limette-hell); box-shadow: none; }
.upload.drueber { border-color: var(--gruen); background: var(--gruen-mittel); }
.upload .upload-text { flex: 0 1 auto; display: flex; flex-direction: column; line-height: 1.3; }
.upload .upload-text span { font-size: 12.5px; }
.upload input[type=text] { flex: 1 1 160px; width: auto; min-width: 140px; }
.upload button { flex: none; }
.upload .unbelegt { flex-basis: 100%; }
/* Dateiauswahl (dateiwahl): sichtbar ist der Knopf, das Feld liegt durchsichtig darüber */
.dateiwahl { display: inline-flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; max-width: 100%; vertical-align: middle; }
.dateiwahl-knopf { position: relative; overflow: hidden; white-space: nowrap; flex: none; }
.dateiwahl-knopf input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; opacity: 0; cursor: pointer; font-size: 0; }
.dateiwahl-knopf input[type=file]::file-selector-button { cursor: pointer; }
.dateiwahl-knopf:focus-within { outline: 2px solid var(--gruen); outline-offset: 2px; }
.dateiwahl-name { font-size: 13px; overflow-wrap: anywhere; min-width: 0; }
.dateiwahl-name.dateiwahl-leer { color: var(--grau); }
.upload .unbelegt:empty { display: none; }
/* ablauf „so läuft es“: aufklappbar, zustand im browser */
details.ablauf-karte > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
details.ablauf-karte > summary::-webkit-details-marker { display: none; }
details.ablauf-karte > summary h2 { margin: 0; }
details.ablauf-karte > summary .grau { font-size: 12.5px; }
details.ablauf-karte > summary::before { content: "▸"; color: var(--grau); }
details.ablauf-karte[open] > summary::before { content: "▾"; }
details.ablauf-karte .ablauf { max-width: 620px; margin-top: 14px; }
/* ---------- suche oben: trefferliste unter dem feld ---------- */
.gs-liste { position: absolute; top: calc(100% + 6px); left: 0; width: min(560px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto; background: var(--weiss); border: 1px solid var(--linie); border-radius: 10px; box-shadow: 0 8px 28px rgba(20, 30, 25, .16); z-index: 20; padding: 6px 0; }
.gs-liste[hidden] { display: none; }
.gs-gruppe { font-size: 11px; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .05em; padding: 8px 14px 4px; }
.gs-treffer { display: block; padding: 6px 14px; color: var(--text); text-decoration: none; cursor: pointer; }
.gs-treffer .t { font-weight: 600; font-size: 13px; }
.gs-treffer .k { font-size: 12px; color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gs-treffer.an, .gs-treffer:hover { background: var(--limette-hell); }
.gs-mehr, .gs-leer, .gs-hinweis { font-size: 12px; color: var(--grau); padding: 4px 14px 6px; }
.gs-leer { padding: 10px 14px; }
.gs-fuss { font-size: 11.5px; color: var(--grau); border-top: 1px solid var(--linie); margin-top: 4px; padding: 6px 14px 2px; }
.topbar .suche kbd { position: absolute; right: 10px; top: 8px; font: 11px/1 ui-monospace, monospace; color: var(--grau); border: 1px solid var(--linie); border-radius: 4px; padding: 3px 5px; background: var(--weiss); }
.topbar .suche input:focus + kbd { display: none; }
/* hinweise zu e-mail-adresse und deutscher fassung */
.marke-klein { display: inline-block; margin: 3px 4px 0 0; padding: 0 7px; border-radius: 99px; font-size: 11px; font-weight: 600; background: var(--rot-hell); color: var(--rot); white-space: nowrap; }
.marke-klein.auto { background: var(--blau-hell); color: var(--blau); }
.hinweis.gelb { background: var(--gelb-hell); color: #5a4000; }
.hinweis ul { margin: 4px 0 0; padding-left: 18px; }
.post .brief .marke-klein { float: none; }
/* ---------- ruhige seiten: eine hauptsache, der rest einen klick entfernt ---------- */
/* übersicht: stand aller positionen als eine schmale zeile; „so läuft es“ nicht über die ganze breite */
.standzeile { display: flex; align-items: center; gap: 18px; padding: 12px 18px; }
.standzeile h2 { margin: 0 0 6px; }
.donut-halter.klein { width: 80px; margin: 0; flex: none; }
.donut-halter.klein .mitte .zahl { font-size: 17px; }
.standzahlen { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--grau); }
.standzahlen b { color: var(--text); }
.standzahlen i, .kennzeile i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; }
details.ablauf-karte { max-width: 760px; }
/* vorgang: kennzahlen als eine zeile, schrittleiste knapp */
.kennzeile { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 8px; }
.kennzeile button { background: #fff; color: var(--text); border: 1px solid var(--linie); padding: 3px 11px; border-radius: 99px; font-size: 12.5px; }
.kennzeile button:hover { background: var(--flaeche); border-color: #ced4da; }
.kennzeile button.an { border-color: var(--limette); background: var(--limette-hell); }
.kennzeile button b { font-weight: 700; }
.schritte.knapp { margin: 2px 0 10px; }
.schritte.knapp .schritt { padding-top: 21px; font-size: 11.5px; }
/* erledigter Schritt, bei dem einzelne Positionen noch offen sind: grüne Linie wie erledigt,
   statt der Nummer ein Warnzeichen und darunter, wie viele noch offen sind */
.schritt.rest .n { background: #fff; border-color: var(--orange); color: var(--orange); display: grid; place-items: center; }
.schritt.rest { color: var(--text); }
.schritt-warn { display: block; color: var(--orange); font-weight: 600; font-size: 11px; }
.schritt-neben { font-size: 12.5px; margin: -4px 0 10px; }
.schritt-neben button { background: none; border: none; padding: 0; color: var(--orange); font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; }
/* knappe hinweise: eine zeile mit zahl und „anzeigen“, einzelheiten nach dem klick */
details.hinweis.knapp { padding: 8px 14px; margin-bottom: 8px; }
details.hinweis.knapp > summary { cursor: pointer; list-style: none; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
details.hinweis.knapp > summary::-webkit-details-marker { display: none; }
details.hinweis.knapp > summary .anzeigen { margin-left: auto; font-size: 12.5px; font-weight: 600; text-decoration: underline; white-space: nowrap; }
details.hinweis.knapp[open] > summary .anzeigen::after { content: " ▴"; }
details.hinweis.knapp:not([open]) > summary .anzeigen::after { content: " ▾"; }
details.hinweis.knapp[open] > summary { margin-bottom: 8px; }
/* protokoll: je position eine zeile, die suchschritte auf klick */
.ereignis .schritte-knopf { display: block; background: none; border: none; padding: 0; margin-top: 2px; font-size: 11.5px; color: var(--grau); text-decoration: underline; cursor: pointer; }
.ereignis .schritte-liste { margin: 4px 0 0; padding-left: 14px; color: var(--grau); font-size: 12px; }
.log-mehr { width: 100%; margin-top: 8px; }
/* bereich mit teilen unter der tabelle (vorgang) und unter den funden (artikel) */
.bereich { padding: 14px 18px; }
.bereich > h2 { margin-bottom: 6px; }
details.teil { border-top: 1px solid var(--linie); }
details.teil > summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; padding: 10px 2px; font-weight: 600; }
details.teil > summary::-webkit-details-marker { display: none; }
details.teil > summary::before { content: "▸"; color: var(--grau); width: 10px; }
details.teil[open] > summary::before { content: "▾"; }
details.teil > summary:hover { color: var(--gruen); }
.teil-marke { font-size: 11.5px; font-weight: 700; border-radius: 99px; padding: 1px 9px; background: var(--gelb-hell); color: var(--gelb); }
.teil-marke.rot { background: var(--rot-hell); color: var(--rot); }
.teil-marke[hidden] { display: none; }
.teil-kurz { font-weight: 400; font-size: 12.5px; color: var(--grau); }
.teil-inhalt { padding: 0 2px 14px 20px; }
/* artikel: vorprüfung oben im fund, belege kurz, weitere angaben aufklappbar */
.fund-pruefung { border-left: 3px solid var(--linie); padding: 7px 10px; margin-bottom: 10px; font-size: 13px; border-radius: 0 6px 6px 0; }
.fund-pruefung.ok { background: var(--gruen-hell); border-color: var(--gruen-marke); color: var(--gruen); }
.fund-pruefung.warnung { background: var(--rot-hell); border-color: var(--rot); color: #5c120d; }
.fund-pruefung.unklar { background: var(--gelb-hell); border-color: var(--gelb); color: #5a4000; }
.fund-pruefung.ohne { background: var(--flaeche); color: var(--grau); }
.fund-links { display: flex; gap: 4px 14px; flex-wrap: wrap; font-size: 12.5px; margin-top: 3px; }
.beleg-knopf { background: none; border: none; padding: 0; font: inherit; font-size: 12px; color: var(--grau); text-align: left; cursor: pointer; max-width: 100%; }
.beleg-knopf:hover { background: none; color: var(--text); }
.beleg-knopf .lang, .beleg-knopf.offen .kurz { display: none; }
.beleg-knopf.offen .lang { display: inline; white-space: normal; }
.beleg-knopf .kurz { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: 100%; vertical-align: bottom; }
.abgeleitet { font-size: 12px; color: var(--grau); font-style: italic; }
details.mehr-angaben { margin-top: 6px; }
details.mehr-angaben > summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--gruen); padding: 4px 0; }
details.herkunft-zeile { font-size: 12px; color: var(--grau); margin-top: 2px; }
details.herkunft-zeile > summary { cursor: pointer; }
details.herkunft-zeile[open] { color: var(--text); }
@media (max-width: 900px) { .standzeile { flex-wrap: wrap; } .teil-inhalt { padding-left: 4px; } }
/* wer nur lesen darf, sieht keine Formulare zum Ändern */
body.leser .nur-schreiben { display: none !important; }
</style>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Dateinamen zum Lesen: „Konformit#U00e4tserkl#U00e4rung“ -> „Konformitätserklärung“ (so kamen
// die Namen beim Packen an). Nur zum Anzeigen, nie für Links oder Anfragen: dort bleibt der Pfad.
const dateiLesbar = s => s == null ? s : String(s).replace(/#U([0-9a-fA-F]{4})|#L([0-9a-fA-F]{8})/g, (m, u, l) => {
  const code = parseInt(u || l, 16);
  return code > 0x10FFFF || (code >= 0xD800 && code <= 0xDFFF) ? m : String.fromCodePoint(code);
});
// Dateiauswahl auf Deutsch statt „Choose File / No file chosen“ des Browsers: ein Knopf
// („Datei auswählen“) und daneben der Name der gewählten Datei. Das echte <input type="file">
// liegt unsichtbar (durchsichtig, nicht display:none) genau über dem Knopf: Ein Klick trifft es,
// mit Tab ist es erreichbar (Enter oder Leertaste öffnet die Auswahl), Bildschirmleser und
// automatische Tests setzen weiter Dateien darauf. attr: Attribute des Feldes als HTML (id,
// accept, onchange …); knopf: Text des Knopfes; knopfId: id des sichtbaren Knopfes; name: schon
// gewählte Datei (nach dem Neuzeichnen); titel: Name des Feldes für Bildschirmleser, wenn kein
// <label for> darauf zeigt. Gewählt wird über das Feld wie bisher (feld.files, onchange).
const DATEI_LEER = "Keine Datei ausgewählt";
function dateiwahl(attr, { knopf = "Datei auswählen", knopfId = "", name = "", titel = "", klasse = "", leise = true } = {}) {
  return `<span class="dateiwahl ${klasse}"><span class="knopf ${leise ? "leise " : ""}dateiwahl-knopf"${knopfId ? ` id="${knopfId}"` : ""}>${esc(knopf)}<input type="file" ${attr}${titel ? ` aria-label="${esc(titel)}"` : ""}></span><span class="dateiwahl-name${name ? "" : " dateiwahl-leer"}" aria-live="polite">${esc(name || DATEI_LEER)}</span></span>`;
}
// Name neben dem Knopf nach dem Feld richten; auch für Module, die feld.files selbst setzen
function dateiwahlZeigen(feld) {
  const el = feld?.closest(".dateiwahl")?.querySelector(".dateiwahl-name");
  if (!el) return;
  const f = feld.files?.[0];
  el.textContent = f ? f.name : DATEI_LEER;
  el.classList.toggle("dateiwahl-leer", !f);
}
// nach dem onchange des Feldes selbst (das eine falsche Datei wieder leeren kann)
document.addEventListener("change", e => { if (e.target.matches?.(".dateiwahl input[type=file]")) dateiwahlZeigen(e.target); });
const $ = sel => document.querySelector(sel);
const eingabeAktiv = () => ["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName) && document.activeElement.id !== "suche";

// Freigabe ohne Klick eines Menschen (services/freigabe.automatisch)
const AUTO_TITEL = "Der Agent hat das Dokument selbst freigegeben: Es lag im eigenen Bestand, und die Vorprüfung hatte nichts zu beanstanden.";

function chip(status, suche_in) {
  const s = STATUS[status] || { text: status };
  const extra = status === "suche" && suche_in ? `: ${esc(suche_in)}` : "";
  const punkt = status === "suche" ? '<span class="punkt"></span>' : "";
  return `<span class="chip s-${esc(status)}">${punkt}${esc(s.text)}${extra}</span>`;
}

function toast(text) {
  const t = $("#toast"); t.textContent = text; t.classList.add("an");
  clearTimeout(toast.z); toast.z = setTimeout(() => t.classList.remove("an"), 2600);
}

const SERVER_WEG = "Der ATEX-Agent ist gerade nicht erreichbar. Bitte versuchen Sie es in ein paar Minuten noch einmal.";

async function api(pfad, opt = {}) {
  const o = { ...opt };
  if (o.json !== undefined) { o.body = JSON.stringify(o.json); o.headers = { "Content-Type": "application/json" }; delete o.json; }
  let r;
  try { r = await fetch(API + pfad, o); }
  catch (f) { console.error(pfad, f); throw new Error(SERVER_WEG); }
  $("#api-status").textContent = "";
  if (!r.ok) {
    let msg = "";
    try { const j = await r.json(); msg = j.fehler || j.error || ""; } catch {}
    // ohne Satz vom Backend nie den Rohtext des Servers („Bad Gateway“) zeigen
    if (!msg) msg = r.status >= 500 ? SERVER_WEG : "Das hat nicht geklappt. Bitte laden Sie die Seite neu und versuchen Sie es noch einmal.";
    console.warn(pfad, r.status, msg);
    // status: damit eine Seite „gibt es nicht“ (404) von „nicht erreichbar“ unterscheiden kann
    throw Object.assign(new Error(msg), { status: r.status });
  }
  const typ = r.headers.get("content-type") || "";
  return typ.includes("json") ? r.json() : r;
}

// ---------- seitenwechsel: zähler und timer je seite (seiten/README.md, „Seitenwechsel“) ----------
// route() zählt seitenNr hoch. Wer lädt, merkt sich mit seitenWache() den Stand und zeichnet nach
// jedem await nur, wenn die Wache noch true sagt: sonst malte die Antwort einer langsamen Anfrage
// die alte Seite über die neue. Timer einer Seite laufen über seiteIntervall/seiteTimeout und enden
// beim Verlassen der Seite; ein Takt fällt aus, solange der vorige noch läuft oder der Tab verdeckt ist.
let seitenNr = 0;
const seitenTimer = new Set();
function seitenWache() { const nr = seitenNr; return () => nr === seitenNr; }
function seiteVerlassen() {
  seitenNr++;
  for (const t of seitenTimer) t.stopp();
  seitenTimer.clear();
}
function seiteIntervall(fn, ms, wache = seitenWache()) {
  if (!wache()) return null;  // die Seite ist schon verlassen: nichts mehr anmelden
  let laeuft = false;
  const takt = async () => {
    if (!wache() || laeuft || document.hidden) return;
    laeuft = true;
    try { await fn(); } catch (f) { console.error(f); } finally { laeuft = false; }
  };
  const id = setInterval(takt, ms);
  const t = { stopp: () => clearInterval(id), takt };
  seitenTimer.add(t);
  return t;
}
function seiteTimeout(fn, ms, wache = seitenWache()) {
  if (!wache()) return null;
  const t = { stopp: () => clearTimeout(id) };
  const id = setTimeout(() => { seitenTimer.delete(t); if (wache()) fn(); }, ms);
  seitenTimer.add(t);
  return t;
}
// wieder sichtbar: gleich einmal auffrischen statt bis zum nächsten Takt zu warten
document.addEventListener("visibilitychange", () => { if (!document.hidden) for (const t of seitenTimer) t.takt?.(); });

// ---------- erweiterungen: je funktion eine datei unter seiten/, siehe README.md ----------
// seiten:  { name, muster: /^#\/…/, vorgang?: true, zeige(m, app) }   eigene seite; mit vorgang ist m[1] die vorgangs-id
// nav:     { name, href | href(v), text, icon?, vorgang?: true, zahl?(v) } eintrag links, unter "Daten" oder im vorgang
// vorgang: { titel, zeichne(v, el) }    abschnitt unten auf der vorgangsseite
// artikel: { titel, zeichne(a, el) }    abschnitt unten auf der artikelseite
const ERWEITERUNGEN = { seiten: [], nav: [], vorgang: [], artikel: [] };
// Ausgeblendet, nicht gelöscht: Der Code der Module bleibt, nur Seite, Eintrag links und Abschnitt
// erscheinen nicht mehr. Zum Wiedereinschalten den Namen (name oder schluessel) hier streichen.
// ex-liste/listen: EX-Bauteil-Liste · fragen: Fragen im Vorgang · zertifikate: Dokumentenarchiv
// mit Versionen und Prüfregeln · veraltet: Abschnitt „Veraltete Zertifikate“ · ablauf: „So läuft es“
// sprachmodelle: Seite „Sprachmodelle“ (die Wahl je Vorgang unter „Einstellungen“ bleibt)
// sprachen: Seite „Sprachversionen“ (die Sprachen wählt man beim Start des Agenten)
const AUSGEBLENDET = new Set(["ex-liste", "listen", "Ex-Teil oder nicht?", "fragen", "zertifikate", "veraltet", "ablauf", "sprachmodelle", "sprachen"]);
// Treffer der Suche oben, die auf eine ausgeblendete Seite zeigen würden
const zielAusgeblendet = ziel => /^#\/(zertifikate|sprachmodelle)|\/(fragen|ex-liste|sprachen)\b/.test(ziel || "");
function erweitere(art, eintrag) {
  if ([eintrag.name, eintrag.schluessel, eintrag.titel].some(x => AUSGEBLENDET.has(x))) return;
  ERWEITERUNGEN[art].push(eintrag);
}

// ---------- aufklappen: zustand je <details data-merk="…"> im browser gemerkt ----------
const AUF = "atex-aufgeklappt";
function aufZustand() { try { return JSON.parse(localStorage.getItem(AUF) || "{}"); } catch { return {}; } }
function auf(schl, standard = false) { const z = aufZustand(); return schl in z ? !!z[schl] : standard; }
function aufSetzen(schl, offen) {
  const z = aufZustand(); z[schl] = !!offen;
  try { localStorage.setItem(AUF, JSON.stringify(z)); } catch {}
}
const offenAttr = (schl, standard) => auf(schl, standard) ? "open" : "";
// „toggle“ steigt nicht auf, deshalb in der Einfangphase am Dokument
document.addEventListener("toggle", e => { const s = e.target?.dataset?.merk; if (s) aufSetzen(s, e.target.open); }, true);

// Abschnitte der Module: ein ruhiger Bereich unter der Tabelle (Vorgang) bzw. unter den Funden
// (Artikel), je Modul ein aufklappbarer Teil. Ein Modul setzt mit teilMarke(el, text) eine Marke
// auf den geschlossenen Kopf, wenn dort etwas zu tun ist.
const BEREICH = { vorgang: "Einstellungen", artikel: "Weitere Möglichkeiten" };
const teilSchluessel = (art, e) => `${art}-${e.schluessel || e.titel}`;
function abschnitte(art, daten) {
  if (!daten || !ERWEITERUNGEN[art].length) return;
  const rahmen = document.createElement("section");
  rahmen.className = "karte bereich";
  rahmen.innerHTML = `<h2>${esc(BEREICH[art])}</h2>`;
  for (const e of ERWEITERUNGEN[art]) {
    const schl = teilSchluessel(art, e);
    const teil = document.createElement("details");
    teil.className = "teil";
    teil.id = `teil-${schl}`;
    teil.dataset.merk = schl;
    teil.open = auf(schl);
    teil.innerHTML = `<summary><span class="teil-titel">${esc(e.titel)}</span><span class="teil-kurz"></span><span class="teil-marke" hidden></span></summary>`;
    const el = document.createElement("div");
    el.className = "teil-inhalt";
    teil.appendChild(el);
    rahmen.appendChild(teil);
    try { e.zeichne(daten, el); } catch (f) { console.error(e.titel, f); el.textContent = `Der Abschnitt „${e.titel}“ ließ sich nicht anzeigen. Bitte laden Sie die Seite neu.`; }
  }
  $("#app").appendChild(rahmen);
}
// Marke (z. B. „2 veraltet“) und kurzer Stand neben dem Titel eines Teils; leer blendet aus
function teilMarke(el, text, farbe = "gelb") {
  const m = el?.closest("details.teil")?.querySelector(":scope > summary .teil-marke");
  if (!m) return;
  m.textContent = text || ""; m.hidden = !text; m.className = `teil-marke ${farbe}`;
}
function teilKurz(el, text) {
  const k = el?.closest("details.teil")?.querySelector(":scope > summary .teil-kurz");
  if (k) k.textContent = text || "";
}
// einen Teil aufklappen und hinscrollen (z. B. „Einstellungen“ neben „Erneut suchen“)
function teilOeffnen(id) {
  const t = document.getElementById(`teil-${id}`);
  if (!t) return;
  t.open = true;
  t.scrollIntoView({ behavior: "smooth", block: "start" });
  t.querySelector("summary")?.focus({ preventScroll: true });
}
async function erweiterteSeite(e, m) {
  const wache = seitenWache();
  // eine andere Seite: die alte nicht stehen lassen, bis die neue geladen ist (Reiter derselben
  // Seite, z. B. im Dokumentenarchiv, bleiben stehen und wechseln ohne Flackern)
  if (zustand.seite !== e.name) $("#app").innerHTML = `<div class="leer">Wird geladen …</div>`;
  zustand.seite = e.name;
  if (e.vorgang) {
    const vid = +m[1];
    if (zustand.vid !== vid || !zustand.v) { zustand.vid = vid; zustand.v = null; }
    let v;
    try { v = await api(`/api/vorgaenge/${vid}`); }
    catch (f) { if (wache()) $("#app").innerHTML = `<div class="karte unbelegt">Der Vorgang ließ sich nicht laden. ${esc(f.message)}</div>`; return; }
    if (!wache()) return;
    zustand.v = v;
  } else zustand.v = null;
  zeichneNav();
  try { await e.zeige(m, $("#app"), wache); }
  catch (f) { if (wache()) $("#app").innerHTML = `<div class="karte unbelegt">${esc(f.message)}</div>`; }
}

// Stand als Balken in den Farben der Gruppen: dieselben Farben wie im Ring der Übersicht und in
// der Kennzahlzeile des Vorgangs (Befund K1)
function leiste(zaehler, anzahl) {
  return `<div class="leiste-balken">${GRUPPEN.map(g => [g, gruppenWert(zaehler, g)]).filter(([, n]) => n).map(([g, n]) =>
    `<span title="${esc(g.text)}: ${n}" style="width:${100 * n / anzahl}%;background:${g.farbe}"></span>`).join("")}</div>`;
}

// ---------- einstellungen (nur im browser gespeichert) ----------
function einstellungen() { try { return JSON.parse(localStorage.getItem("atex-einstellungen") || "{}"); } catch { return {}; } }
function einstellungSetzen(k, wert) {
  const e = einstellungen(); e[k] = wert;
  localStorage.setItem("atex-einstellungen", JSON.stringify(e));
  einstellungenAnwenden();
}
function einstellungenAnwenden() {
  const e = einstellungen();
  document.body.classList.toggle("kompakt", !!e.kompakt);
  zeichneProfil();
}
// ---------- anmeldung: wer angemeldet ist, steht in der sitzung des servers ----------
// wer entscheidet (M3): der server nimmt den namen aus der sitzung, nicht aus der anfrage. die
// helfer bleiben fuer die module: anwender() ist der anzeigename, sperre()/nameHinweis() sperren
// schreibende knoepfe fuer die rolle „leser“, mitName(fn) ruft fn(name) nur, wenn schreiben erlaubt ist
let ich = null;  // {id, login, name, rolle, rolle_text} von /api/auth/ich
const angemeldet = () => ich;
const istAdmin = () => ich?.rolle === "admin";
function anwender() { return ich?.name || ""; }
const NAME_FEHLT = "Bitte melden Sie sich an.";
const NUR_LESEN = "Mit Ihrem Zugang können Sie hier nur ansehen.";
const darfSchreiben = () => !!anwender() && ich.rolle !== "leser";
const sperrgrund = () => anwender() ? NUR_LESEN : NAME_FEHLT;
const sperre = () => darfSchreiben() ? "" : `disabled title="${sperrgrund()}"`;
const nameHinweis = () => darfSchreiben() ? "" : `<span class="namehinweis grau">${sperrgrund()}</span>`;
function mitName(fn) {
  if (!darfSchreiben()) return toast(sperrgrund());
  return fn(anwender());
}
function zeichneProfil() {
  // Leser: alles Schreibende mit der Klasse „nur-schreiben“ ausblenden (Formulare, Hochladen)
  document.body.classList.toggle("leser", !!ich && !darfSchreiben());
  $("#profil").innerHTML = ich ? `
    <div class="avatar" aria-hidden="true">${ICON.person}</div>
    <div><div class="wer" title="${esc(ich.name)}">${esc(ich.name)}</div><div class="rolle">${esc(ich.rolle_text || "")}</div></div>
    <button class="icon abmelden" onclick="abmelden()" title="Abmelden" aria-label="Abmelden">${ICON.abmelden}</button>` : "";
}

// jede antwort 401 (sitzung abgelaufen, abgemeldet) fuehrt zur anmeldung, auch aus den modulen;
// danach geht es auf derselben seite weiter (der #-pfad bleibt)
const _fetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const r = await _fetch(...args);
  const ziel = String(args[0]?.url ?? args[0]);
  if (r.status === 401 && !ziel.includes("/api/auth/")) {
    // Ein einzelnes 401 (z. B. vom Dokumentenarchiv) meldet noch niemanden ab: erst fragen, ob
    // die Anmeldung wirklich weg ist
    let weg = true;
    try { weg = (await _fetch(`${API}/api/auth/ich`)).status === 401; } catch {}
    if (weg) abgemeldet("Ihre Anmeldung ist abgelaufen. Bitte melden Sie sich erneut an.");
  }
  return r;
};

function abgemeldet(grund) {
  seiteVerlassen();
  const warAngemeldet = !!ich;
  ich = null;
  document.body.classList.remove("startet");
  if (document.body.classList.contains("abgemeldet")) return;  // schon sichtbar: eingaben behalten
  document.body.classList.add("abgemeldet");
  $("#anmeldung").hidden = false;
  $("#anmelde-grund").textContent = warAngemeldet && grund ? grund : "Bitte melden Sie sich mit Ihrem Zugang an.";
  $("#an-fehler").textContent = "";
  $("#an-passwort").value = "";
  setTimeout(() => ($("#an-login").value ? $("#an-passwort") : $("#an-login")).focus(), 0);
}

function angemeldetWeiter(daten) {
  ich = daten;
  document.body.classList.remove("startet", "abgemeldet");
  $("#anmeldung").hidden = true;
  zeichneProfil();
  route();
}

async function anmeldungPruefen() {
  let r;
  try { r = await _fetch(`${API}/api/auth/ich`); }
  catch (f) { console.error(f); abgemeldet(); $("#an-fehler").textContent = SERVER_WEG; return; }
  if (r.ok) angemeldetWeiter(await r.json());
  else abgemeldet();
}

$("#anmelde-form").onsubmit = async e => {
  e.preventDefault();
  const login = $("#an-login").value.trim(), passwort = $("#an-passwort").value;
  if (!login || !passwort) { $("#an-fehler").textContent = "Bitte geben Sie Anmeldename und Passwort ein."; return; }
  $("#an-knopf").disabled = true; $("#an-fehler").textContent = "";
  try {
    const r = await _fetch(`${API}/api/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ login, passwort }) });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok) { $("#an-fehler").textContent = r.status >= 500 ? SERVER_WEG : (j.fehler || j.error || "Die Anmeldung hat nicht geklappt. Bitte versuchen Sie es noch einmal."); $("#an-passwort").select(); return; }
    $("#an-passwort").value = "";
    angemeldetWeiter(j);
  } catch (f) { console.error(f); $("#an-fehler").textContent = SERVER_WEG; }
  finally { $("#an-knopf").disabled = false; }
};

async function abmelden() {
  try { await _fetch(`${API}/api/auth/logout`, { method: "POST" }); } catch (f) { console.error(f); }
  $("#app").innerHTML = "";  // nichts vom vorigen benutzer stehen lassen
  $("#an-login").value = "";
  abgemeldet();
}

async function passwortAendern() {
  const alt = $("#pw-alt").value, neu = $("#pw-neu").value, nochmal = $("#pw-nochmal").value;
  const fehler = t => { $("#pw-fehler").textContent = t; };
  if (!alt || !neu) return fehler("Bitte geben Sie Ihr bisheriges und Ihr neues Passwort ein.");
  if (neu !== nochmal) return fehler("Die beiden neuen Passwörter sind verschieden. Bitte geben Sie das neue Passwort zweimal gleich ein.");
  fehler("");
  try {
    await api("/api/auth/passwort", { method: "POST", json: { alt, neu } });
    for (const id of ["#pw-alt", "#pw-neu", "#pw-nochmal"]) $(id).value = "";
    document.activeElement.blur();
    toast("Ihr Passwort ist geändert. Auf anderen Geräten melden Sie sich bitte neu an.");
  } catch (e) { fehler(e.message); }
}

// ---------- seitenleiste + suche ----------
function zeichneNav() {
  const s = zustand.seite;
  const imVorgang = zustand.v && (["vorgang", "artikel", "mails"].includes(s) || ERWEITERUNGEN.seiten.some(e => e.name === s && e.vorgang));
  const eintrag = n => `<a href="${typeof n.href === "function" ? n.href(zustand.v) : n.href}" class="${s === n.name ? "an" : ""}">${n.icon || ICON.liste} ${esc(n.text)}${n.zahl && n.zahl(zustand.v) ? `<span class="zahl">${n.zahl(zustand.v)}</span>` : ""}</a>`;
  // sichtbar(): nur fuer bestimmte rollen (z. b. „Benutzer“ nur fuer admins); unten: eigene
  // gruppe „Admin“ unter den einstellungen
  const navSichtbar = ERWEITERUNGEN.nav.filter(n => !n.sichtbar || n.sichtbar());
  const daten = navSichtbar.filter(n => !n.vorgang && !n.unten);

// ---------- suche oben: filtert die sichtbare liste und sucht in der ganzen anwendung ----------
// GET /api/suche?q= (services/globalsuche.py): gruppen mit treffern {titel, kontext, ziel}.
// Pfeile wählen, Enter öffnet, Esc schließt; „/“ oder Strg+K springen ins Feld.
const GS = { daten: null, fehler: null, laedt: false, aktiv: -1, timer: null, nr: 0 };
const gsListe = () => $("#gs-liste");
const gsTreffer = () => (GS.daten?.gruppen || []).flatMap(g => g.treffer);

$("#suche").oninput = () => {
  zustand.suche = $("#suche").value.trim().toLowerCase();
  if (zustand.seite === "start") zeichneStartListe();
  else if (zustand.seite === "projekte") zeichneProjekte();
  else if (zustand.seite === "vorgang" && zustand.v) zeichneArtikel();
  globalSuchen();
};

function globalSuchen() {
  clearTimeout(GS.timer);
  const q = $("#suche").value.trim();
  if (!q) { GS.daten = null; GS.fehler = null; gsSchliessen(); return; }
  GS.laedt = true; GS.enterWartet = false;
  GS.timer = setTimeout(async () => {
    const nr = ++GS.nr;
    try {
      const d = await api(`/api/suche?q=${encodeURIComponent(q)}`);
      if (nr !== GS.nr) return;  // inzwischen weiter getippt
      d.gruppen = (d.gruppen || []).map(g => {
        const treffer = g.treffer.filter(t => !zielAusgeblendet(t.ziel));
        return treffer.length === g.treffer.length ? g : { ...g, treffer, anzahl: treffer.length };
      }).filter(g => g.treffer.length || (g.hinweis && g.art !== "archiv"));
      d.anzahl = d.gruppen.reduce((n, g) => n + g.anzahl, 0);
      GS.daten = d; GS.fehler = null;
    } catch (e) {
      if (nr !== GS.nr) return;
      GS.daten = null; GS.fehler = e.message;
    }
    GS.laedt = false; GS.aktiv = gsTreffer().length ? 0 : -1;
    if (GS.enterWartet) { GS.enterWartet = false; if (gsTreffer().length) return gsOeffnen(0); }
    if (document.activeElement === $("#suche")) gsZeichnen();
  }, 180);
  if (!gsListe().hidden && !GS.daten) gsZeichnen();
}

function gsZeichnen() {
  const el = gsListe(), d = GS.daten, q = $("#suche").value.trim();
  if (!q) return gsSchliessen();
  let html;
  if (GS.fehler) html = `<div class="gs-leer">Die Suche hat gerade nicht geklappt. ${esc(GS.fehler)}</div>`;
  else if (!d) html = `<div class="gs-leer">Suche läuft …</div>`;
  else if (d.zu_kurz) html = `<div class="gs-leer">Bitte geben Sie mindestens zwei Buchstaben oder Ziffern ein.</div>`;
  else if (!d.gruppen.length) html = `<div class="gs-leer">Zu „${esc(q)}“ hat die Suche nichts gefunden. Gesucht wird in Vorgängen, Positionen, Stammdaten und Herstellern. Bindestriche und Leerzeichen dürfen Sie weglassen.</div>`;
  else {
    let i = 0;
    html = d.gruppen.map(g => `<div class="gs-gruppe">${esc(g.titel)} (${g.anzahl})</div>
      ${g.hinweis ? `<div class="gs-hinweis">${esc(g.hinweis)}</div>` : ""}
      ${g.treffer.map(t => { const n = i++; return `<a class="gs-treffer ${n === GS.aktiv ? "an" : ""}" role="option" id="gs-t-${n}" aria-selected="${n === GS.aktiv}"
          href="${esc(t.ziel)}" onmousedown="event.preventDefault()" onclick="gsOeffnen(${n}); return false">
          <div class="t">${esc(t.titel)}</div>${t.kontext ? `<div class="k">${esc(t.kontext)}</div>` : ""}</a>`; }).join("")}
      ${g.anzahl > g.treffer.length ? `<div class="gs-mehr">${g.anzahl - g.treffer.length} weitere hier nicht gezeigt. Bitte geben Sie mehr vom Suchbegriff ein.</div>` : ""}`).join("")
      + `<div class="gs-fuss">${d.anzahl === 1 ? "1 Treffer" : `${d.anzahl} Treffer`}. Mit den Pfeiltasten wählen, mit Enter öffnen, mit Esc schließen.</div>`;
  }
  el.innerHTML = html;
  el.hidden = false;
  $("#suche").setAttribute("aria-expanded", "true");
  $(`#gs-t-${GS.aktiv}`)?.scrollIntoView({ block: "nearest" });
}

function gsSchliessen() {
  gsListe().hidden = true;
  $("#suche").setAttribute("aria-expanded", "false");
}

function gsOeffnen(n) {
  const t = gsTreffer()[n];
  if (!t) return;
  gsSchliessen();
  $("#suche").blur();
  if (location.hash === t.ziel) route(); else location.hash = t.ziel;
}

$("#suche").onkeydown = e => {
  const n = gsTreffer().length;
  if (e.key === "Escape") { gsSchliessen(); $("#suche").blur(); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!n) return;
    e.preventDefault();
    if (gsListe().hidden) { gsZeichnen(); return; }
    GS.aktiv = (GS.aktiv + (e.key === "ArrowDown" ? 1 : n - 1)) % n;
    gsZeichnen();
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (GS.laedt) { GS.enterWartet = true; return; }  // erst die Treffer zum neuen Text
    if (n) gsOeffnen(Math.max(GS.aktiv, 0));
  }
};
$("#suche").onfocus = () => { if ($("#suche").value.trim()) gsZeichnen(); };
$("#suche").onblur = () => setTimeout(gsSchliessen, 120);
document.addEventListener("keydown", e => {
  const tippt = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !tippt && !e.ctrlKey && !e.metaKey && !e.altKey)) {
    if (!ich) return;
    e.preventDefault();
    $("#suche").focus(); $("#suche").select();
  }
});

// ---------- router ----------
function route() {
  seiteVerlassen();  // alte Anfragen zeichnen nicht mehr, Timer der alten Seite enden
  if (!ich) { anmeldungPruefen(); return; }  // erst wissen, wer angemeldet ist
  zustand.suche = ""; $("#suche").value = "";
  let m;
  const e = ERWEITERUNGEN.seiten.find(e => (m = location.hash.match(e.muster)));
  if (e) erweiterteSeite(e, m);
  else if ((m = location.hash.match(/^#\/v\/(\d+)\/a\/(\d+)/))) artikelSeite(+m[1], +m[2]);
  else if ((m = location.hash.match(/^#\/mails\/(\d+)/))) mailSeite(+m[1]);
  else if ((m = location.hash.match(/^#\/v\/(\d+)/))) vorgangSeite(+m[1]);
  else if ((m = location.hash.match(/^#\/projekte(?:\/(\d{4}))?/))) projekteSeite(m[1] ? +m[1] : null);
  else if (location.hash.startsWith("#/einstellungen")) einstellungenSeite();
  else startSeite();
}
window.addEventListener("hashchange", route);

async function hochladen(file) {
  if (!darfSchreiben()) { $("#upload-fehler").textContent = sperrgrund(); return; }
  const fd = new FormData();
  fd.append("datei", file);
  fd.append("name", $("#name").value);
  $("#upload-fehler").textContent = "";
  try {
    const r = await api("/api/vorgaenge", { method: "POST", body: fd });
    location.hash = `#/v/${r.id}`;
  } catch (e) { $("#upload-fehler").textContent = e.message; }
}

async function ladeProjekte(erstes = false) {
  if (!erstes && tabelleTippt()) return;  // Feld in einer Tabelle offen: beim nächsten Mal
  const wache = seitenWache();
  let liste;
  try { liste = await api("/api/vorgaenge"); }
  catch (e) {
    console.error("Vorgänge nicht geladen:", e);
    if (wache() && $("#liste")) { $("#liste").innerHTML = `<span class="unbelegt">${SERVER_WEG}</span>`; }
    return;
  }
  if (!wache()) return;  // inzwischen eine andere Seite
  const geaendert = JSON.stringify(liste) !== JSON.stringify(zustand.projekte);
  zustand.projekte = liste;
  if (!erstes && !geaendert) return;
  if (zustand.seite === "start") { zeichneStartListe(); zeichneDiagramme(); }
  else if (zustand.seite === "projekte") zeichneProjekte();
}

const fortschritt = v => v.anzahl ? Math.round(100 * ((v.zaehler.geprueft || 0) + (v.zaehler.in_db || 0) + (v.zaehler.kein_ex || 0)) / v.anzahl) : 100;

function zeichneStartListe() {
  if (!$("#liste")) return;

}


function zeichneDiagramme() {
  if (!$("#diagramme")) return;
  const liste = zustand.projekte;
  if (!liste.length) { $("#diagramme").innerHTML = ""; return; }
  const gesamt = {};
  for (const v of liste) for (const [s, n] of Object.entries(v.zaehler)) gesamt[s] = (gesamt[s] || 0) + n;
  const teile = GRUPPEN.map(g => ({ ...g, wert: gruppenWert(gesamt, g) })).filter(t => t.wert > 0);
  const summe = teile.reduce((s, t) => s + t.wert, 0);

  // kleiner Ring neben den Zahlen, eine schmale Zeile; kreisringe per dasharray, 2px luecke.
  // Die Balken je Vorgang stehen in der Liste darunter (früher doppelt als „Vorgänge im Vergleich“).
  const R = 30, C = 2 * Math.PI * R;
  let versatz = 0;
  const ringe = teile.map(t => {
    const anteil = t.wert / summe;
    const strich = Math.max(anteil * C - 2, 1);
    const ring = `<circle r="${R}" cx="40" cy="40" fill="none" stroke="${t.farbe}" stroke-width="12"
      stroke-dasharray="${strich} ${C - strich}" stroke-dashoffset="${-versatz}"><title>${esc(t.text)}: ${t.wert}</title></circle>`;
    versatz += anteil * C;
    return ring;
  }).join("");

  $("#diagramme").innerHTML = `<div class="karte standzeile">
    <div class="donut-halter klein">
      <svg viewBox="0 0 80 80" width="80" height="80" style="transform:rotate(-90deg)" role="img" aria-label="Stand aller Positionen">${ringe}</svg>
      <div class="mitte"><div class="zahl">${summe}</div></div>
    </div>
    <div><h2>Stand aller Positionen</h2>
      <div class="standzahlen">${teile.map(t => `<span><i style="background:${t.farbe}"></i><b>${t.wert}</b> ${esc(t.text)}</span>`).join("")}</div></div>
  </div>`;
}

const PROJEKT_SORT = {
  name: (a, b) => a.name.localeCompare(b.name, "de"), erstellt: (a, b) => zeitVon(a).localeCompare(zeitVon(b)),
  anzahl: (a, b) => a.anzahl - b.anzahl, offen: (a, b) => a.offen - b.offen, fortschritt: (a, b) => fortschritt(a) - fortschritt(b),
};
// Filter bleiben im Zustand: über das Neuladen alle 5 s und die Rückkehr aus einem Projekt hinweg
const projektFilterLeer = () => ({ text: "", stand: "", schritt: "", von: "", bis: "", sort: "erstellt", ab: true });
const pf = () => zustand.pf || (zustand.pf = projektFilterLeer());

async function projekteSeite(jahr) {
  zustand.seite = "projekte"; zustand.v = null; zustand.jahr = jahr;
  zeichneNav();
  if (pf().text) { zustand.suche = pf().text.toLowerCase(); $("#suche").value = pf().text; }  // route() leert das Suchfeld
  $("#app").innerHTML = `<div class="leer">Wird geladen …</div>`;
  const wache = seitenWache();
  await ladeProjekte(true);
  seiteIntervall(() => ladeProjekte(), 5000, wache);
}

function projekteGefiltert() {
  const f = pf(), q = zustand.suche || "";
  const liste = zustand.projekte.filter(v =>
    (zustand.jahr === null || jahrVon(v) === zustand.jahr)
    && (!q || [v.name, v.maschine, v.datei].join(" ").toLowerCase().includes(q))
    && (!f.stand || PROJEKT_STAND[f.stand]?.[1](v))
    && (!f.schritt || v.schritt === f.schritt)
    && (!f.von || tagVon(v) >= f.von) && (!f.bis || tagVon(v) <= f.bis));
  const vgl = PROJEKT_SORT[f.sort] || PROJEKT_SORT.erstellt;
  return liste.sort((a, b) => (f.ab ? -1 : 1) * vgl(a, b) || b.id - a.id);
}

function zeichneProjekte() {
  const f = pf(), alle = zustand.projekte;
  f.text = $("#suche").value.trim();
  const jahre = {};
  for (const v of alle) {
    const j = jahrVon(v); if (!j) continue;
    jahre[j] = jahre[j] || { projekte: 0, positionen: 0, offen: 0 };
    jahre[j].projekte++; jahre[j].positionen += v.anzahl; jahre[j].offen += v.offen;
  }
  const schluessel = Object.keys(jahre).sort((a, b) => b - a);
  if (!$("#pf-rahmen")) {
    const wahl = (id, titel, paare) => `<div><label for="pf-${id}">${titel}</label><select id="pf-${id}" onchange="projektFilter('${id}', this.value)">${paare.map(([k, t]) => `<option value="${k}">${esc(t)}</option>`).join("")}</select></div>`;
    $("#app").innerHTML = `
      <div class="kopfzeile"><div><h1>Projekte</h1><div class="grau">Hier finden Sie alle Vorgänge. Wählen Sie ein Jahr oder grenzen Sie die Liste mit den Filtern ein.</div></div></div>
      <div id="pf-rahmen">
        <div class="jahres-raster" id="pf-jahre"></div>
        <div class="karte" style="margin-top:16px">
          <div class="pf-filter">
            <div class="pf-text"><label for="pf-text">Suchen nach Name, Maschine oder Datei</label>
              <input type="text" id="pf-text" placeholder="zum Beispiel TM-1" oninput="projektFilter('text', this.value)"></div>
            <div id="pf-jahr-halter"></div>
            ${wahl("stand", "Stand", [["", "Alle"], ...Object.entries(PROJEKT_STAND).map(([k, [t]]) => [k, t])])}
            ${wahl("schritt", "Schritt", [["", "Alle"], ...Object.entries(PROJEKT_SCHRITT)])}
            <div><label for="pf-von">Hochgeladen ab</label><input type="date" id="pf-von" class="pf-datum" onchange="projektFilter('von', this.value)"></div>
            <div><label for="pf-bis">Hochgeladen bis</label><input type="date" id="pf-bis" class="pf-datum" onchange="projektFilter('bis', this.value)"></div>
            <div><button class="leise" onclick="projektFilter('zurueck')">Filter zurücksetzen</button></div>
          </div>
          <div class="grau" id="pf-zahl" style="font-size:12.5px;margin:4px 0 8px"></div>
          <div id="pf-liste"></div>
        </div>
      </div>`;
  }
  // Felder nur setzen, wenn niemand darin tippt
  const setze = (id, w) => { const el = $(`#pf-${id}`); if (el && document.activeElement !== el && el.value !== w) el.value = w; };
  setze("text", f.text); setze("stand", f.stand); setze("schritt", f.schritt); setze("von", f.von); setze("bis", f.bis);
  $("#pf-jahr-halter").innerHTML = `<label for="pf-jahr">Jahr</label><select id="pf-jahr" onchange="location.hash = this.value ? '#/projekte/' + this.value : '#/projekte'">
    <option value="">Alle Jahre</option>${schluessel.map(j => `<option value="${j}" ${+j === zustand.jahr ? "selected" : ""}>${j}</option>`).join("")}</select>`;
  $("#pf-jahre").innerHTML = schluessel.length ? `
    <div class="jahr-karte ${zustand.jahr === null ? "pf-an" : ""}" onclick="location.hash='#/projekte'">
      <div class="jahr">Alle</div><div class="grau">${mitZahl(alle.length, "Vorgang", "Vorgänge")}</div></div>
    ${schluessel.map(j => `
    <div class="jahr-karte ${+j === zustand.jahr ? "pf-an" : ""}" onclick="location.hash='#/projekte/${j}'">
      <div class="jahr">${j}</div>
      <div class="grau">${mitZahl(jahre[j].projekte, "Vorgang", "Vorgänge")} mit ${mitZahl(jahre[j].positionen, "Position", "Positionen")}</div>
      <div style="margin-top:8px">${jahre[j].offen ? `<span class="chip s-mail_entwurf">${jahre[j].offen} offen</span>` : '<span class="chip s-geprueft">alles vollständig</span>'}</div>
    </div>`).join("")}` : `<div class="karte leer">Noch keine Vorgänge. Laden Sie auf der Übersicht eine Stückliste hoch.</div>`;
  const liste = projekteGefiltert();
  const filterAn = f.text || f.stand || f.schritt || f.von || f.bis || zustand.jahr !== null;
  $("#pf-zahl").textContent = `${filterAn ? `Sie sehen ${liste.length} von ${mitZahl(alle.length, "Vorgang", "Vorgängen")}` : `Sie sehen alle ${mitZahl(alle.length, "Vorgang", "Vorgänge")}`}, sortiert nach ${PROJEKT_SPALTE[f.sort]}, ${PROJEKT_RICHTUNG[f.sort][f.ab ? 0 : 1]}.`;
  const kopf = Object.fromEntries(Object.entries(PROJEKT_SPALTE).map(([k, titel]) =>
    [k, `<button class="pf-sort ${f.sort === k ? "an" : ""}" onclick="projektSort('${k}')" title="Nach ${titel} sortieren. Ein zweiter Klick kehrt die Reihenfolge um.">${titel}${f.sort === k ? (f.ab ? " ▼" : " ▲") : ""}</button>`]));
  $("#pf-liste").innerHTML = vorgangsTabelle(liste, "vorgaenge-projekte", kopf, true);
}

function projektFilter(feld, wert) {
  const f = pf();
  if (feld === "zurueck") {
    zustand.pf = projektFilterLeer();
    zustand.suche = ""; $("#suche").value = "";
    if (zustand.jahr !== null) { location.hash = "#/projekte"; return; }
  } else if (feld === "text") {
    f.text = wert; zustand.suche = wert.trim().toLowerCase(); $("#suche").value = wert;
  } else f[feld] = wert;
  zeichneProjekte();
}
function projektSort(k) {
  const f = pf();
  if (f.sort === k) f.ab = !f.ab; else { f.sort = k; f.ab = k !== "name"; }
  zeichneProjekte();
}
