const WARNZEICHEN = '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M12 3 2 20h20z" fill="currentColor"/><path d="M12 10v5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.3" fill="#fff"/></svg>';
const SCHRITTE = [
  ["eingelesen", "Eingelesen"], ["maengel", "Angaben prüfen"], ["suche", "Suche"],
  ["pruefung", "Prüfung"], ["anfragen", "Anfragen"], ["ausgabe", "Ausgabe"],
];

// Stufe des Vorgangs für die Schrittleiste. Nach der Suche (schritt „pruefung“ vom Backend) zeigt
// sie die echte Stufe, auch wenn einzelnen Positionen noch Angaben fehlen; die stehen daneben (K3).
function aktuellerSchritt(v) {
  const z = v.zaehler;
  if (v.vollstaendig) return "ausgabe";
  if (v.schritt === "suche") return "suche";
  if (v.schritt === "eingelesen" || v.schritt === "maengel") return z.info_fehlt ? "maengel" : "eingelesen";
  if (z.zu_pruefen || z.mail_entwurf) return "pruefung";
  if (z.angefordert || z.erinnert || z.eskaliert) return "anfragen";
  return "pruefung";
}

// ---------- vorgang: kennzahlen, liste, ereignisse ----------
async function vorgangSeite(vid) {
  Object.assign(zustand, { seite: "vorgang", vid, v: null, filter: "alle", bearbeiten: null, logSeit: 0, log: [], logOffen: new Set(), mails: [], protokollOffen: false });
  $("#app").innerHTML = `<div class="leer">Wird geladen …</div>`;
  const wache = seitenWache();
  aktualisierenKette = Promise.resolve();  // Abrufe der vorigen Seite zeichnen ohnehin nicht mehr
  await aktualisieren(vid, true);
  seiteIntervall(() => aktualisieren(vid), 1500, wache);
}

// nie zwei Abrufe gleichzeitig (Takt und Neuladen nach dem Speichern einer Tabelle): sonst kämen
// neue Protokolleinträge doppelt an. Die Wache gilt ab dem Aufruf: ein Abruf, der noch in der
// Kette wartet, während die Seite wechselt, zeichnet nicht mehr.
let aktualisierenKette = Promise.resolve();
function aktualisieren(vid, erstes = false) {
  const wache = seitenWache();
  return (aktualisierenKette = aktualisierenKette.then(() => aktualisierenEinmal(vid, erstes, wache)));
}
async function aktualisierenEinmal(vid, erstes, wache) {
  const hier = () => wache() && zustand.seite === "vorgang" && zustand.vid === vid;
  if (!hier()) return;
  try {
    const [v, neu, mails] = await Promise.all([
      api(`/api/vorgaenge/${vid}`),
      api(`/api/vorgaenge/${vid}/ereignisse?seit=${zustand.logSeit}`),
      api(`/api/vorgaenge/${vid}/mails`),
    ]);
    if (!hier()) return;
    const geaendert = JSON.stringify(v) !== JSON.stringify(zustand.v) || neu.length || JSON.stringify(mails) !== JSON.stringify(zustand.mails);
    zustand.v = v; zustand.mails = mails;
    zustand.log.push(...neu); zustand.logSeit += neu.length;
    const neueNotizen = await notizenLaden(v);
    if (!hier()) return;
    if (erstes || geaendert || neueNotizen) zeichneVorgang();
  } catch (e) {
    if (!hier()) return;
    if (erstes) $("#app").innerHTML = `<div class="karte unbelegt">Der Vorgang ließ sich nicht laden. ${esc(e.message)}</div>`;
    else $("#api-status").textContent = "Die Verbindung ist unterbrochen …";
  }
}

function zeichneVorgang() {
  const v = zustand.v;
  // eingaben nicht ueberschreiben, solange jemand tippt (zeilen-bearbeitung, korrekturen)
  if (eingabeAktiv()) return;
  zeichneNav();
  const jetzt = aktuellerSchritt(v);
  const idx = SCHRITTE.findIndex(s => s[0] === jetzt);
  const laeuft = v.schritt === "suche";
  const nieGestartet = v.schritt === "eingelesen" || v.schritt === "maengel";
  const z = v.zaehler;
  // nach der Suche: Positionen ohne Angaben neben der Schrittleiste nennen, nicht als Stufe
  const wartenAufAngaben = idx > 1 && z.info_fehlt;
  const logPos = $("#log")?.scrollTop || 0;

  $("#app").innerHTML = `
    <div class="kopfzeile" style="margin-bottom:8px">
      <div><a href="#/" class="grau" style="text-decoration:none">← Übersicht</a><h1>${esc(v.name)}</h1>
        <div class="grau">${mitZahl(v.anzahl, "Position", "Positionen")} · erstellt am ${esc(v.erstellt)}</div></div>
      <div class="rechts">
        <button class="leise" id="proto-knopf" onclick="protokollAuf()" title="Was der Agent und Sie in diesem Vorgang getan haben" aria-haspopup="dialog">${laeuft ? '<span class="punkt"></span>' : ""}Protokoll</button>
        <button class="leise" onclick="teilOeffnen('vorgang-einstellungen')" title="Sprachmodell und Websuche für diesen Vorgang">Einstellungen</button>
        <button onclick="starten()" ${laeuft ? "disabled" : sperre()}>${laeuft ? "Der Agent sucht …" : nieGestartet ? "Agent starten" : "Erneut suchen"}</button>
        <a class="knopf leise ${v.vollstaendig ? "" : "aus"}" href="${API}/api/vorgaenge/${v.id}/export"
           title="${v.vollstaendig ? "Die Kundenliste als Excel-Datei herunterladen" : `Das geht erst, wenn alles vollständig ist. Offen ${v.offen === 1 ? "ist noch 1 Position" : `sind noch ${v.offen} Positionen`}.`}">Kundenliste ausgeben</a>
      </div>
    </div>

    <div class="schritte knapp">${SCHRITTE.map((s, i) => {
      const rest = wartenAufAngaben && s[0] === "maengel";
      // übersprungen: der Vorgang ist weiter, einzelne Positionen warten noch auf Angaben
      return `<div class="schritt ${rest ? "fertig rest" : i < idx ? "fertig" : i === idx ? "jetzt" : ""}" ${rest ? `title="${esc(mitZahl(z.info_fehlt, "Position wartet", "Positionen warten"))} noch auf Angaben. Die übrigen sind schon weiter. Sie erkennen sie in der Liste am Stand „Angabe fehlt“."` : ""}><span class="n">${rest ? WARNZEICHEN : i + 1}</span>${s[1]}${rest ? `<span class="schritt-warn">${mitZahl(z.info_fehlt, "Position", "Positionen")} noch offen</span>` : ""}</div>`;
    }).join("")}</div>
    ${v.vollstaendig ? `<div class="hinweis gruen" style="padding:8px 14px;margin-bottom:8px"><strong>Vollständig.</strong> Alle Ex-Teile haben ein freigegebenes Zertifikat. Sie können die Kundenliste jetzt ausgeben.</div>` : ""}

    <div id="inhalt"></div>
    <div class="proto-schleier" id="proto" ${zustand.protokollOffen ? "" : "hidden"} onmousedown="if (event.target === this) protokollZu()">
      <aside class="proto-blatt" role="dialog" aria-modal="true" aria-labelledby="proto-titel">
        <div class="proto-kopf"><h2 id="proto-titel">Protokoll</h2><button class="leise" id="proto-zu" onclick="protokollZu()">Schließen</button></div>
        <div class="log-scroll" id="log">${protokollHtml(v)}</div>
      </aside>
    </div>`;
  if ($("#log")) $("#log").scrollTop = logPos;  // beim Neuzeichnen an derselben Stelle bleiben

  zeichneArtikel();
}

// Kennzahlen als eine schmale Zeile, in den Farben der Gruppen; jede Zahl filtert die Tabelle
function kennzeileHtml(v) {
  const g = schl => GRUPPEN.find(x => x.schl === schl);
  const wert = schl => gruppenWert(v.zaehler, g(schl));
  const zahl = (filter, n, text, farbe, titel) => `<button class="${zustand.filter === filter ? "an" : ""}" onclick="filtern('${filter}')" title="${esc(titel)}">${farbe ? `<i style="background:${farbe}"></i>` : ""}<b>${n}</b> ${esc(text)}</button>`;
  return [
    zahl("alle", v.anzahl, v.anzahl === 1 ? "Position" : "Positionen", "", "Alle Positionen zeigen"),
    zahl("g-fertig", wert("fertig"), "freigegeben", g("fertig").farbe, "Nur freigegebene Positionen zeigen"),
    zahl("g-pruefen", wert("pruefen"), "zu prüfen", g("pruefen").farbe, "Nur Positionen zeigen, die Sie prüfen müssen"),
    wert("angaben") ? zahl("g-angaben", wert("angaben"), wert("angaben") === 1 ? "Angabe fehlt" : "Angaben fehlen", g("angaben").farbe, "Nur Positionen zeigen, denen eine Angabe fehlt") : "",
    wert("anfragen") ? zahl("g-anfragen", wert("anfragen"), wert("anfragen") === 1 ? "Anfrage" : "Anfragen", g("anfragen").farbe, "Nur Positionen mit E-Mail an den Hersteller zeigen") : "",
    zahl("g-offen", v.offen, "offen", "", "Alle offenen Positionen zeigen"),
  ].join("");
}

// Protokoll: zusammenhängende Einträge einer Position sind eine Zeile (ihr Ergebnis), die
// Suchschritte davor auf Klick. Zu sehen sind die neuesten Zeilen, der Rest auf Wunsch.
const PROTOKOLL_KURZ = 15;
function protokollAuf() { zustand.protokollOffen = true; $("#proto").hidden = false; $("#proto-zu").focus(); }
function protokollZu() { zustand.protokollOffen = false; if ($("#proto")) $("#proto").hidden = true; $("#proto-knopf")?.focus(); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && zustand.protokollOffen && zustand.seite === "vorgang") protokollZu(); });
function protokollGruppen(log) {
  const gruppen = [];
  log.forEach((e, i) => {
    const g = gruppen[gruppen.length - 1];
    if (e.artikel_id && g && g.artikel_id === e.artikel_id) g.eintraege.push(e);
    else gruppen.push({ artikel_id: e.artikel_id, nr: i, eintraege: [e] });
  });
  return gruppen.reverse();
}
function protokollHtml(v) {
  if (!zustand.log.length) return '<div class="leer" style="padding:12px">Noch nichts. Sobald Sie den Agenten starten, steht hier, was er tut.</div>';
  const gruppen = protokollGruppen(zustand.log);
  const alle = auf("vorgang-protokoll-alle");
  const zeigen = alle ? gruppen : gruppen.slice(0, PROTOKOLL_KURZ);
  const offen = zustand.logOffen || (zustand.logOffen = new Set());
  const zeile = g => {
    const e = g.eintraege[g.eintraege.length - 1], vorher = g.eintraege.slice(0, -1);
    const schritte = vorher.length ? `<button class="schritte-knopf" onclick="event.stopPropagation();protokollSchritte(${g.nr})" aria-expanded="${offen.has(g.nr)}">${offen.has(g.nr) ? "Suchschritte ausblenden" : vorher.length === 1 ? "1 Suchschritt davor" : `${vorher.length} Suchschritte davor`}</button>
      ${offen.has(g.nr) ? `<ul class="schritte-liste">${vorher.map(x => `<li>${esc(x.zeit)}: ${esc(x.text)}</li>`).join("")}</ul>` : ""}` : "";
    return e.artikel_id
      ? `<div class="ereignis klick" onclick="location.hash='#/v/${v.id}/a/${e.artikel_id}'" title="Position öffnen"><div class="zeit">${esc(e.zeit)}</div>${esc(e.text)}${schritte}</div>`
      : `<div class="ereignis"><div class="zeit">${esc(e.zeit)}</div>${esc(e.text)}</div>`;
  };
  return zeigen.map(zeile).join("")
    + (gruppen.length > PROTOKOLL_KURZ ? `<button class="leise log-mehr" onclick="protokollAlle()">${alle ? "Nur die neuesten Einträge zeigen" : `Ganzes Protokoll anzeigen (${mitZahl(zustand.log.length, "Eintrag", "Einträge")})`}</button>` : "");
}
function protokollAlle() { aufSetzen("vorgang-protokoll-alle", !auf("vorgang-protokoll-alle")); $("#log").innerHTML = protokollHtml(zustand.v); }
function protokollSchritte(nr) {
  const offen = zustand.logOffen || (zustand.logOffen = new Set());
  if (offen.has(nr)) offen.delete(nr); else offen.add(nr);
  $("#log").innerHTML = protokollHtml(zustand.v);
}

// fehlende E-Mail-Adressen: eine Zeile, die Hersteller auf Klick
function kontaktHinweis(v) {
  if (!v.kontakte_fehlen) return "";
  const hersteller = {};
  for (const a of v.artikel.filter(a => a.kontakt_fehlt)) (hersteller[a.hersteller] = hersteller[a.hersteller] || []).push(a);
  return `<details class="hinweis rot knapp" data-merk="vorgang-kontakte" ${offenAttr("vorgang-kontakte")}>
    <summary><strong>${v.kontakte_fehlen === 1 ? "Ein E-Mail-Entwurf wartet" : `${v.kontakte_fehlen} E-Mail-Entwürfe warten`} auf die Adresse des Herstellers.</strong><span class="anzeigen">anzeigen</span></summary>
    Ohne Adresse lässt sich nichts senden. ${Object.keys(hersteller).length ? `Es fehlt die Adresse von ${Object.entries(hersteller).map(([h, l]) =>
      `${esc(h)} (${l.map(a => `<a href="#/v/${v.id}/a/${a.id}">Position ${esc(a.pos)}</a>`).join(", ")})`).join(", ")}.` : ""}
    <div style="margin-top:6px"><a href="#/stammdaten/hersteller">Adresse in den Stammdaten eintragen</a></div>
  </details>`;
}

// grund einer fehlenden angabe: „notiz“ des artikels (fehlende artikelnummer, fehlender einbauort,
// offene ex-entscheidung …); die liste des vorgangs liefert sie nicht mit, daher aus /api/artikel/<id>
// neu geholt, sobald sich die zeile aendert (z. b. nach einer korrektur)
const notizVon = a => a.notiz ?? zustand.notizen[a.id]?.notiz;
async function notizenLaden(v) {
  const fehlt = v.artikel.filter(a => a.status === "info_fehlt" && a.notiz === undefined);
  for (const id of Object.keys(zustand.notizen)) if (!fehlt.some(a => a.id === +id)) delete zustand.notizen[id];
  const neu = fehlt.filter(a => zustand.notizen[a.id]?.zeile !== JSON.stringify(a));
  const details = await Promise.all(neu.map(a => api(`/api/artikel/${a.id}`).catch(() => null)));
  neu.forEach((a, i) => { zustand.notizen[a.id] = { zeile: JSON.stringify(a), notiz: details[i]?.notiz || "" }; });
  return neu.length > 0;
}

function maengelHinweis(v) {
  const fehlt = v.artikel.filter(a => a.status === "info_fehlt");
  if (!fehlt.length) return "";
  return `<details class="hinweis rot knapp korrektur" data-merk="vorgang-maengel" ${offenAttr("vorgang-maengel")}>
    <summary><strong>${fehlt.length === 1 ? "Bei einer Position fehlt eine Angabe." : `Bei ${fehlt.length} Positionen fehlt eine Angabe.`}</strong> <span>Ohne sie kann der Agent nicht suchen.</span><span class="anzeigen">anzeigen</span></summary>
    ${nameHinweis()}
    <table><tbody>${fehlt.map(a => `<tr>
      <td style="width:60px">Pos. ${esc(a.pos)}</td><td>${esc(a.bezeichnung)}<br><span class="grau">${esc(a.hersteller)}</span>
        <div class="grund">${esc(notizVon(a) || (a.artikelnr ? "Eine Angabe fehlt." : "Die Hersteller-Artikelnummer fehlt."))}</div></td>
      </tr>`).join("")}
    </tbody></table>
    <div style="margin-top:6px;font-size:12.5px">Tragen Sie die fehlenden Angaben direkt in der Tabelle unten ein.
      <button class="leise" style="padding:2px 10px;font-size:12px" onclick="filtern('info_fehlt')">Nur diese Positionen zeigen</button></div>
    <div class="zeile" style="margin-top:8px"><button class="leise" onclick="maengelSenden()" ${sperre()}>Mängelliste an den Einkauf senden</button>
      <span style="font-size:12px">Sie können auch die korrigierte Stückliste als neuen Vorgang hochladen.</span></div>
  </details>`;
}

function zeichneArtikel() {
  const v = zustand.v;
  if (!$("#inhalt")) return;
  const filter = ["alle", ...REIHENFOLGE.filter(s => v.zaehler[s])];
  let liste = v.artikel.filter(a => zustand.filter === "alle"
    || (GRUPPE[zustand.filter] ? GRUPPE[zustand.filter].includes(a.status) : a.status === zustand.filter));
  if (zustand.suche) liste = liste.filter(a =>
    [a.pos, a.bezeichnung, a.hersteller, a.artikelnr, a.profile_no, a.einbauort].join(" ").toLowerCase().includes(zustand.suche));

// Positionen eines Vorgangs als Tabelle (tabelle.js). Gespeichert wird je Zeile über
// PATCH /api/artikel/<id> (services/korrektur.py: Verlauf, Meldungen, neue Suche), erst nach Bestätigung.
const POS_FELD = { description: "Bezeichnung", manufacturer: "Hersteller", manufacturer_article_no: "Hersteller-Artikelnr.",
  profile_no: "PRO.FILE-Nr.", location: "Einbauort", quantity: "Menge" };
// was eine Korrektur außerdem bewirkt, in Worten für den Bestätigungsdialog (auch für die Module)
function positionsFolgen(werte) {
  const felder = Object.keys(werte).filter(f => POS_FELD[f]), t = [];
  const leer = felder.filter(f => !String(werte[f] ?? "").trim());
  const und = l => l.length > 1 ? `${l.slice(0, -1).join(", ")} und ${l[l.length - 1]}` : l[0];
  if (leer.length) t.push(`${und(leer.map(f => POS_FELD[f]))} darf nicht leer sein. Diese Zeile wird deshalb nicht gespeichert.`);
  const suche = felder.filter(f => !["description", "quantity"].includes(f));
  if (suche.length) t.push(`Weil sich ${und(suche.map(f => POS_FELD[f]))} ändert, fallen offene Funde und nicht gesendete E-Mail-Entwürfe dieser Position weg. Die Position muss danach neu gesucht werden, zum Beispiel unter „Korrektur“.`);
  else if (felder.length) t.push("Bezeichnung und Menge lösen keine neue Suche aus. Offene Funde bleiben erhalten.");
  if (felder.includes("profile_no")) t.push("Mit der neuen PRO.FILE-Nr. gehört die Position danach zu einem anderen Bauteil in den Stammdaten.");
  if (felder.length) t.push("Die Korrektur steht mit Ihrem Namen im Verlauf. Passt sie zu einer offenen Meldung wie „Der Hersteller fehlt.“, wird diese Meldung abgehakt.");
  return t;
}
const positionSpeichern = (id, werte, { von, notiz }) =>
  api(`/api/artikel/${id}`, { method: "PATCH", json: { von, ...(notiz ? { note: notiz } : {}), ...werte } });

function positionenTabelle(v, liste) {
  const waehrendSuche = () => v.schritt === "suche" ? "Während der Agent sucht, lassen sich die Positionen nicht ändern. Bitte warten Sie, bis die Suche fertig ist." : "";
  const feld = (s, titel, a, mehr = {}) => ({ s, titel, wert: x => x[a], gesperrt: waehrendSuche, ...mehr });
  return Tabelle.html({
    id: `positionen-${v.id}`, titel: `Positionen von „${v.name}“`, zeilen: liste, name: a => `Position ${a.pos}`,
    leer: "In diesem Filter gibt es keine Positionen.",
    spalten: [
      { s: "pos", titel: "Pos.", gesperrt: "Die Positionsnummer kennzeichnet die Zeile der Stückliste und lässt sich nicht ändern." },
      feld("description", "Bezeichnung", "bezeichnung"),
      feld("manufacturer", "Hersteller", "hersteller"),
      feld("manufacturer_article_no", "Hersteller-Art.-Nr.", "artikelnr", { klasse: "mono", zeige: w => w ? esc(w) : '<span class="unbelegt">fehlt</span>' }),
      feld("profile_no", "PRO.FILE-Nr.", "profile_no", { klasse: "mono" }),
      feld("quantity", "Menge", "menge"),
      feld("location", "Einbauort", "einbauort"),
      { s: "status", titel: "Stand", zeige: (w, a) => chip(a.status, a.suche_in)
          + (a.automatisch ? `<br><span class="marke-klein auto" title="${esc(AUTO_TITEL)}">automatisch freigegeben</span>` : "")
          + (a.kontakt_fehlt ? `<br><span class="marke-klein" title="Für den Hersteller ist noch keine E-Mail-Adresse hinterlegt.">E-Mail-Adresse fehlt</span>` : "")
          + (a.deutsch_fehlt ? `<br><span class="marke-klein" title="Die deutsche Fassung der EU-Konformitätserklärung fehlt noch.">deutsche Fassung fehlt</span>` : ""),
        gesperrt: "Der Stand ergibt sich aus Funden, Freigaben und E-Mails. Sie ändern ihn mit den Knöpfen bei der Position." },
    ],
    zusatz: { zelle: a => `<a href="#/v/${v.id}/a/${a.id}" class="knopf leise pos-oeffnen" title="Position öffnen und Funde prüfen">Öffnen<span class="pfeil"> →</span></a>` },
    rahmenKlasse: "pos-liste",
    notiz: "Notiz zur Korrektur, falls Sie eine festhalten möchten",
    folgen: (a, werte) => positionsFolgen(werte),
    speichern: (a, werte, opt) => positionSpeichern(a.id, werte, opt),
    nachher: () => aktualisieren(v.id, true),
  });
}

// Position auf ihrer eigenen Seite ändern: dieselben Felder und Folgen wie in der Liste
const POS_WERT = { description: "bezeichnung", manufacturer: "hersteller", manufacturer_article_no: "artikelnr",
  profile_no: "profile_no", location: "einbauort", quantity: "menge" };
function positionBearbeiten() {
  const a = zustand.a;
  positionDialogZu();
  const el = document.createElement("div");
  el.className = "tg-schleier"; el.id = "pos-dialog";
  el.innerHTML = `<div class="tg-dialog" role="dialog" aria-modal="true" aria-labelledby="pos-titel" style="max-width:620px">
    <h2 id="pos-titel">Position ${esc(a.pos)} bearbeiten</h2>
    <div class="pos-form">${Object.entries(POS_FELD).map(([f, titel]) => `<div class="${f === "description" ? "breit" : ""}">
      <label for="pos-${f}">${esc(titel)}</label><input type="text" id="pos-${f}" data-feld="${f}" value="${esc(a[POS_WERT[f]] ?? "")}" oninput="positionFolgenZeigen()"></div>`).join("")}</div>
    <div class="pos-folgen" id="pos-folgen" hidden></div>
    <div id="pos-fehler" class="unbelegt" role="alert" style="margin-top:8px"></div>
    <div class="zeile" style="margin-top:14px;justify-content:flex-end">
      <button class="leise" onclick="positionDialogZu()">Abbrechen</button>
      <button id="pos-speichern" onclick="positionDialogSpeichern()" disabled>Speichern</button>
    </div></div>`;
  el.addEventListener("mousedown", ev => { if (ev.target === el) positionDialogZu(); });
  el.addEventListener("keydown", ev => { if (ev.key === "Escape") positionDialogZu(); });
  document.body.appendChild(el);
  $("#pos-description").focus();
}
function positionDialogZu() { $("#pos-dialog")?.remove(); }
function positionGeaendert() {
  const a = zustand.a, werte = {};
  for (const feld of document.querySelectorAll("#pos-dialog input[data-feld]")) {
    const neu = feld.value.trim();
    if (neu !== String(a[POS_WERT[feld.dataset.feld]] ?? "").trim()) werte[feld.dataset.feld] = neu;
  }
  return werte;
}
function positionFolgenZeigen() {
  const werte = positionGeaendert(), folgen = positionsFolgen(werte), el = $("#pos-folgen");
  el.hidden = !folgen.length;
  el.innerHTML = folgen.map(t => `<div>${esc(t)}</div>`).join("");
  $("#pos-speichern").disabled = !Object.keys(werte).length || Object.values(werte).some(w => !w);
  $("#pos-fehler").textContent = "";
}
function positionDialogSpeichern() {
  const werte = positionGeaendert();
  if (!Object.keys(werte).length) return positionDialogZu();
  mitName(async von => {
    $("#pos-speichern").disabled = true;
    try {
      await positionSpeichern(zustand.a.id, werte, { von });
      positionDialogZu();
      toast("Die Position ist geändert.");
      await neuLaden();
    } catch (e) { if ($("#pos-fehler")) { $("#pos-fehler").textContent = e.message; $("#pos-speichern").disabled = false; } else toast(e.message); }
  });
}

function filtern(f) {

}

async function artikelSeite(vid, aid) {
  Object.assign(zustand, { seite: "artikel", vid, aid, a: null, v: null, fund: null, pdf: null, ablehnOffen: false, fundAuf: new Set(), fundHaken: new Set() });
  $("#app").innerHTML = `<div class="leer">Wird geladen …</div>`;
  const wache = seitenWache();
  await artikelLaden(true);
  seiteIntervall(() => artikelLaden(), 2000, wache);
}

async function artikelLaden(erstes = false) {
  if (eingabeAktiv()) return;
  const wache = seitenWache(), aid = zustand.aid, vid = zustand.vid;
  const hier = () => wache() && zustand.seite === "artikel" && zustand.aid === aid;
  try {
    const [a, v, fa] = await Promise.all([api(`/api/artikel/${aid}`), api(`/api/vorgaenge/${vid}`),
      api(`/api/artikel/${aid}/fundangaben`).catch(() => null)]);
    if (!hier()) return;
    const geaendert = JSON.stringify([a, fa]) !== JSON.stringify([zustand.a, zustand.fundangaben]);
    zustand.a = a; zustand.v = v; zustand.fundangaben = fa;
    if (erstes || geaendert) zeichneArtikelSeite();
  } catch (e) {
    if (!hier()) return;
    if (erstes) $("#app").innerHTML = `<div class="karte unbelegt">Die Position ließ sich nicht laden. ${esc(e.message)}</div>`;
    else $("#api-status").textContent = "Die Verbindung ist unterbrochen …";
  }
}

// Ein Fund mit seinen aus dem PDF gelesenen Werten als Tabelle (tabelle.js): solange er
// unentschieden ist, korrigiert ein Mensch einen falsch gelesenen Wert (PATCH /api/funde/<id>);
// danach steht „von Hand korrigiert“ mit Name und Zeit statt des Belegs.
// Schlüssel aus bearbeiten.FUND_FELDER -> Zeilen aus oberflaeche.felder / angaben.felder mit dem Beleg
const FUND_BELEG = { doc_type: ["Dokumenttyp"], kennzeichnung: ["Kennzeichnung"], zertifikat: ["Zertifikatsnummer"], sprachen: ["Sprachen"],
  gueltig_bis: ["Gültig bis"], ausstellungsdatum: ["Ausgestellt"], ausgabe: ["Ausgestellt"], richtlinien: ["Richtlinien"],
  normen: ["Genannte Normen"], stellen: ["Benannte Stelle"], umgebungstemperatur: ["Umgebungstemperatur"], iecex: ["IECEx-Nummer"] };
// Was eine Korrektur dieses Werts bewirkt (Bestätigungsdialog)
const FUND_FOLGEN = {
  doc_type: "Bei der Freigabe kommt diese Dokumentart in die Stammdaten.",
  kennzeichnung: "Vorprüfung und Belege beziehen sich weiter auf den Wert aus dem PDF. Die Kategorie wird nicht neu berechnet.",
  zertifikat: "Vorprüfung und Belege beziehen sich weiter auf den Wert aus dem PDF.",
  gueltig_bis: "Die Vorprüfung rechnet mit dem neuen Datum: Ist es vorbei, warnt sie. Bei der Freigabe kommt das Datum in die Stammdaten, wenn dort noch keines steht.",
  richtlinien: "Die Vorprüfung rechnet mit den neuen Richtlinien, zum Beispiel ob 2014/34/EU genannt ist.",
};
const FUND_GESPERRT = { Typ: "Der Typ kommt aus der Stückliste. Sie ändern ihn in der Tabelle der Positionen.",
  Kategorie: "Die Kategorie wird aus Kennzeichnung und Einbauort abgeleitet und lässt sich nicht von Hand ändern." };
// „13.11.2026, 14:05 Uhr“
const zeitKurz = iso => {
  if (!iso) return "";
  const d = new Date(/Z$|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z");
  if (isNaN(d)) return iso;
  return `${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" })}, ${d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr`;
};

function fundZeilen(f) {
  const felder = Object.entries(f.felder || {});
  const angaben = zustand.fundangaben?.[f.id];
  const passend = titel => felder.filter(([k]) => k === titel || k.startsWith(titel + " "));
  if (!angaben) return felder.map(([k, x]) => ({ id: "b-" + k, titel: k, wert: x.wert ?? "", belege: [[k, x]], nurBeleg: true }));
  const genutzt = new Set(), zeilen = [];
  for (const a of angaben.felder) {
    const belege = (FUND_BELEG[a.schluessel] || [a.titel]).flatMap(passend);
    belege.forEach(([k]) => genutzt.add(k));
    zeilen.push({ id: a.schluessel, titel: a.titel, art: a.art === "auswahl" || a.art === "datum" ? a.art : "text",
      optionen: (a.optionen || []).map(o => [o, DOKUMENTART[o] || o]), leer: a.leer, wert: a.wert ?? "",
      korrektur: a.korrektur, gelesen: a.gelesen, belege, offen: angaben.offen, liste: !!a.liste });
  }
  for (const [k, x] of felder) if (!genutzt.has(k)) zeilen.push({ id: "b-" + k, titel: k, wert: x.wert ?? "", belege: [[k, x]], nurBeleg: true });
  return zeilen;
}

// „quelle“ aus oberflaeche.QUELLE als Satzanfang
const HERKUNFT = { "Ordner des Herstellers": "Aus dem Ordner des Herstellers", "Ähnlichkeitssuche": "Gefunden von der Ähnlichkeitssuche",
  "Internet": "Aus dem Internet", "von Hand eingefügt": "Von Hand eingefügt", "Antwort des Herstellers": "Antwort des Herstellers",
  "Datenbank": "Schon geprüft in der Datenbank", "Dokumentenarchiv": "Aus dem Dokumentenarchiv" };
// Dokumentart und Sprachen erkennt der Agent aus dem ganzen Dokument; sie stehen nie wörtlich
// darin und gelten deshalb nicht als „unbelegt“ (oberflaeche.felder: abgeleitet, Befund T1)
const ABGELEITET = new Set(["Dokumenttyp", "Sprachen"]);
const istAbgeleitet = (k, x) => !!x?.abgeleitet || ABGELEITET.has(k);
// die Hauptwerte eines Funds; alles andere steht unter „Weitere Angaben“
const HAUPTWERTE = ["doc_type", "kennzeichnung", "zertifikat", "sprachen", "gueltig_bis"];
const HAUPT_TITEL = { Dokumenttyp: "doc_type", Kennzeichnung: "kennzeichnung", Zertifikatsnummer: "zertifikat", Sprachen: "sprachen", "Gültig bis": "gueltig_bis" };
const hauptRang = z => { const i = HAUPTWERTE.indexOf(z.nurBeleg ? HAUPT_TITEL[z.titel] : z.id); return i < 0 ? null : i; };
const PRUEFUNG_TEXT = { ok: "Vorprüfung ohne Befund", warnung: "Vorprüfung mit Warnung", unklar: "Unklar, bitte genau prüfen" };
const fundOffen = id => Tabelle.offen(`fund-${id}`) + Tabelle.offen(`fund-${id}-mehr`);
// wie viele Werte dieser Zeilen ohne Beleg sind (von Hand korrigierte und abgeleitete zählen nicht)
const unbelegtIn = zeilen => zeilen.filter(z => !z.korrektur).reduce((n, z) => n + z.belege.filter(([k, x]) => !x.beleg && !istAbgeleitet(k, x)).length, 0);
// Beleg kürzen: an Wortgrenzen, mit Auslassungszeichen, eine Zeile; der ganze Text auf Klick
function belegKurz(text, max = 90) {
  let t = String(text || "").replace(/\s+/g, " ").trim(), vorn = "", hinten = "";
  const leer = t.indexOf(" ");
  if (t.length > 40 && /^[a-zäöüß]/.test(t) && leer > 0 && leer < 18) { t = t.slice(leer + 1); vorn = "… "; }
  if (t.length > max) { const schnitt = t.lastIndexOf(" ", max); t = t.slice(0, schnitt > max * 0.6 ? schnitt : max).replace(/[\s,;:.(-]+$/, ""); hinten = " …"; }
  return vorn + t + hinten;
}
function belegZeile(b) {
  const lang = `Seite ${b.seite}: „${String(b.text || "").replace(/\s+/g, " ").trim()}“`;
  const kurz = `Seite ${b.seite}: „${belegKurz(b.text)}“`;
  return kurz === lang ? `<span class="beleg">${esc(lang)}</span>`
    : `<button type="button" class="beleg-knopf" onclick="this.classList.toggle('offen')" title="Ganzen Beleg zeigen oder wieder kürzen"><span class="kurz">${esc(kurz)}</span><span class="lang">${esc(lang)}</span></button>`;
}

function fundKarte(f, gewaehlt, pruefbar, alle) {
  // schon geprüfte Dokumente aus den Stammdaten (id < 0) haben keine eigenen Belege
  const angaben = zustand.fundangaben?.[f.id];
  const ERKANNT = '<span class="abgeleitet" title="Das erkennt der Agent aus dem ganzen Dokument. Es steht so nicht wörtlich darin.">vom Agenten erkannt</span>';
  const belegHtml = z => z.korrektur
    ? `<span class="chip s-suche">von Hand korrigiert</span> <span class="beleg">von ${esc(z.korrektur.von)} am ${esc(zeitKurz(z.korrektur.zeit))}${z.korrektur.notiz ? `. Grund: ${esc(z.korrektur.notiz)}` : ""}</span>
       <div class="beleg">${z.gelesen ? `Im PDF gelesen war „${esc(z.id === "doc_type" ? (DOKUMENTART[z.gelesen] || z.gelesen) : z.art === "datum" ? z.gelesen.replace(/^(\d{4})-(\d{2})-(\d{2})$/, "$3.$2.$1") : z.gelesen)}“.` : "Im PDF war dazu nichts gelesen."}</div>`
    : z.belege.length ? z.belege.map(([k, x]) => `<div>${z.belege.length > 1 && x.wert ? `<span class="mono" style="font-size:12px">${esc(x.wert)}</span>: ` : ""}${x.beleg
      ? belegZeile(x.beleg) : istAbgeleitet(k, x) ? ERKANNT : f.id < 0 ? '<span class="grau">aus den Stammdaten</span>' : `<span class="unbelegt">nicht im PDF belegt</span>`}</div>`).join("")
    : ["doc_type", "sprachen"].includes(z.id) && z.wert ? ERKANNT
    : z.wert ? '<span class="unbelegt">nicht im PDF belegt</span>' : '<span class="grau">Im PDF nicht gefunden.</span>';
  const grund = z => z.nurBeleg ? (f.id < 0 ? "Dieses Dokument ist schon geprüft. Ändern können Sie es unter „Stammdaten“."
      : FUND_GESPERRT[z.titel.replace(/ \d+$/, "")] || (angaben ? "Dieser Wert ist ein Beleg aus dem PDF und lässt sich nicht ändern." : "Die Werte lassen sich gerade nicht laden. Bitte laden Sie die Seite neu."))
    : !z.offen ? "Über diesen Fund ist schon entschieden. Gelesene Werte lassen sich nur vorher korrigieren." : "";
  const zeilen = fundZeilen(f);
  const haupt = zeilen.filter(z => hauptRang(z) !== null).sort((a, b) => hauptRang(a) - hauptRang(b));
  const weitere = zeilen.filter(z => hauptRang(z) === null);
  // „nicht belegt“ dort nennen, wo der Wert steht: oben für die Hauptwerte, sonst am Kopf von „Weitere Angaben“
  const unbelegtHaupt = f.id < 0 ? 0 : unbelegtIn(haupt);
  const tabelle = (id, zeilen_) => Tabelle.html({
    id, titel: `Fund ${f.datei}`, zeilen: zeilen_, name: z => z.titel, hinweis: false,
    spalten: [
      { s: "titel", titel: "Angabe", gesperrt: "Das ist die Bezeichnung der Angabe.", still: true, klasse: "grau", stil: "width:150px" },
      { s: "wert", titel: "Wert", art: z => z.art || "text", optionen: z => z.optionen || [], leer: z => z.leer !== false,
        gesperrt: grund, zeige: (w, z) => w ? esc(z.art === "auswahl" ? (DOKUMENTART[w] || w) : z.art === "datum" ? String(w).replace(/^(\d{4})-(\d{2})-(\d{2})$/, "$3.$2.$1") : w) : '<span class="grau">–</span>' },
      { s: "beleg", titel: "Beleg", wert: () => "", zeige: (w, z) => belegHtml(z), gesperrt: "Der Beleg stammt aus dem PDF und lässt sich nicht ändern.", still: true },
    ],
    notiz: "Grund der Korrektur, falls Sie einen festhalten möchten",
    folgen: z => [
      FUND_FOLGEN[z.id] || "Bei der Freigabe gilt der korrigierte Wert.",
      z.liste ? "Mehrere Einträge trennen Sie mit einem Semikolon." : "",
      "Die Korrektur steht mit Ihrem Namen im Protokoll des Vorgangs. Am Fund steht dann „von Hand korrigiert“.",
    ],
    speichern: (z, werte, { von, notiz }) => api(`/api/funde/${f.id}`, { method: "PATCH", json: { von, ...(notiz ? { note: notiz } : {}), [z.id]: werte.wert } }),
    nachher: () => artikelLaden(true),
  });
  // Vorprüfung ganz oben im Fund: man sieht sie vor jedem Wert und vor den Knöpfen (Befund U5)
  const p = f.pruefung;
  const pArt = p && PRUEFUNG_TEXT[p.ergebnis] ? p.ergebnis : "ohne";
  const pruefung = p && (p.ergebnis || p.meldung)
    ? `<div class="fund-pruefung ${pArt}"><strong>${esc(PRUEFUNG_TEXT[p.ergebnis] || "Nicht vorgeprüft")}.</strong>${p.meldung ? ` ${esc(p.meldung)}` : ""}</div>`
    : `<div class="fund-pruefung ohne">${f.id < 0 ? "Dieses Dokument ist schon in den Stammdaten geprüft. In diesem Vorgang gibt es dazu keine eigene Vorprüfung." : "Der Fund ist noch nicht vorgeprüft."}</div>`;
  const lokal = f.pfad && String(f.url || "").startsWith("/files/");
  const links = [
    lokal && f.id > 0 ? `<a href="${API}${esc(f.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Das PDF mit den Markierungen in einem neuen Tab öffnen">In neuem Tab</a>
      <a href="${API}/api/findings/${f.id}/file" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Das PDF ohne Markierungen, wie es abgelegt ist">Original-PDF</a>` : "",
    !lokal && f.id > 0 ? '<span class="grau">Die Datei liegt nicht im Ordner der Ex-Dokumente.</span>' : "",
  ].filter(Boolean).join("");
  const stand = f.status === "freigegeben" ? (f.automatisch ? "Automatisch freigegeben. " : "Freigegeben. ") : f.status === "abgelehnt" ? "Abgelehnt. " : "";
  const herkunftText = `${stand}${HERKUNFT[f.quelle] || f.quelle}${f.seite ? `, Fundstelle auf Seite ${f.seite}` : ""}`;
  const mehrSchl = "fund-weitere-angaben";
  // Zugeklappt zeigt ein Fund nur, welches Dokument es ist: Datei, Art, Sprachen, Herkunft und das
  // Ergebnis der Vorprüfung als Marke. Alles Weitere erst nach dem Aufklappen.
  const auf_ = fundAuf().has(f.id);
  const MARKE = { ok: "ohne Befund", warnung: "Warnung", unklar: "bitte prüfen", ohne: f.id < 0 ? "schon geprüft" : "nicht vorgeprüft" };
  const zeichen = pArt === "ok" || (pArt === "ohne" && f.id < 0) ? "✓" : pArt === "ohne" ? "" : WARNZEICHEN;
  const art = DOKUMENTART[f.doc_type] || f.felder?.Dokumenttyp?.wert || "";
  const sprachen = f.felder?.Sprachen?.wert || "";
  const kopf = `<div class="fund-kopf" role="button" tabindex="0" aria-expanded="${auf_}" title="${auf_ ? "Einzelheiten zuklappen" : "Vorprüfung, gelesene Werte und Belege aufklappen"}"
      onclick="event.stopPropagation();fundKlappen(${f.id})" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); fundKlappen(${f.id}); }">
    ${pruefbar && darfSchreiben() ? `<input type="checkbox" class="fund-haken" ${gewaehlt ? "checked" : ""} onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"
      onchange="fundAnkreuzen(${f.id}, this.checked)" aria-label="${esc(f.datei)} zum Freigeben oder Ablehnen ankreuzen" title="Ankreuzen, um diesen Fund freizugeben oder abzulehnen">` : ""}
    <span class="fund-pfeil" aria-hidden="true">${auf_ ? "▾" : "▸"}</span>
    <span class="fund-name"><strong class="mono">${esc(f.datei)}</strong>
      <span class="grau">${esc([art, sprachen, `${stand}${HERKUNFT[f.quelle] || f.quelle}`.replace(/\.\s*$/, "")].filter(Boolean).join(" · "))}</span></span>
    <span class="fund-marke ${pArt}">${zeichen}${esc(MARKE[pArt])}</span>
    ${f.url ? `<button class="leise" style="padding:2px 10px;font-size:12.5px" onclick="event.stopPropagation();pdfZeigen('${esc(f.url)}')">${zustand.pdf === f.url ? "PDF schließen" : "PDF ansehen"}</button>` : ""}
  </div>`;
  const pdf = zustand.pdf === f.url ? `<iframe class="pdf" src="${API}${esc(f.url)}#page=${f.seite || 1}"></iframe>` : "";
  if (!auf_) return `<div class="fund zu ${gewaehlt ? "gewaehlt" : ""}">${kopf}${pdf}</div>`;
  return `<div class="fund ${gewaehlt ? "gewaehlt" : ""}">
    ${kopf}
    ${pruefung}
    ${window.herkunftZeile ? herkunftZeile(f, alle, herkunftText) : `<div class="grau" style="font-size:12px">${esc(herkunftText)}.</div>`}
    ${unbelegtHaupt ? `<div class="unbelegt" style="margin-top:2px">${unbelegtHaupt === 1 ? "Ein Wert unten ist" : `${unbelegtHaupt} Werte unten sind`} nicht im PDF belegt.</div>` : ""}
    ${links ? `<div class="fund-links zeile">${links}</div>` : ""}
    <div style="margin-top:8px">${tabelle(`fund-${f.id}`, haupt)}</div>
    ${weitere.length ? `<details class="mehr-angaben" data-merk="${mehrSchl}" ${offenAttr(mehrSchl)} onclick="event.stopPropagation()"><summary>Weitere Angaben (${weitere.length})${
      unbelegtIn(weitere) && f.id > 0 ? ` <span class="unbelegt">${unbelegtIn(weitere) === 1 ? "Ein Wert davon ist" : `${unbelegtIn(weitere)} Werte davon sind`} nicht im PDF belegt.</span>` : ""}</summary>
      ${tabelle(`fund-${f.id}-mehr`, weitere)}</details>` : ""}
    ${angaben?.offen && darfSchreiben() ? `<div class="tg-tipp">✎ Stimmt ein Wert nicht? Klicken Sie ihn an und tragen Sie den richtigen ein.</div>`
      : f.status === "freigegeben" && darfSchreiben() ? `<div class="tg-tipp">Dieses Dokument ist freigegeben. Seine Angaben ändern Sie in den <a href="#/stammdaten/dokumente" onclick="event.stopPropagation()">Stammdaten</a>.</div>` : ""}
    ${zustand.pdf === f.url ? `<iframe class="pdf" src="${API}${esc(f.url)}#page=${f.seite || 1}"></iframe>` : ""}
  </div>`;
}

// welche Funde aufgeklappt sind (je Position neu: zugeklappt)
function fundAuf() { return zustand.fundAuf || (zustand.fundAuf = new Set()); }
function fundKlappen(id) {
  const auf_ = fundAuf();
  if (auf_.has(id) && id > 0 && fundOffen(id)) return toast("Bitte speichern oder verwerfen Sie zuerst Ihre Änderungen an diesem Fund.");
  if (auf_.has(id)) auf_.delete(id); else auf_.add(id);
  zeichneArtikelSeite();
}
// angekreuzte Funde: über sie entscheiden „Fund freigeben“ und „Fund ablehnen“
function fundHaken() { return zustand.fundHaken || (zustand.fundHaken = new Set()); }
function fundAnkreuzen(id, an) {
  if (an) fundHaken().add(id); else fundHaken().delete(id);
  document.activeElement?.blur();  // sonst zeichnet die Seite nicht neu (eingabeAktiv)
  zeichneArtikelSeite();
}
const ungespeichert = ids => ids.some(id => fundOffen(id)) && (toast("Bitte speichern oder verwerfen Sie zuerst Ihre Änderungen an den angekreuzten Funden."), true);
function gewaehlteFreigeben(aid) {
  const ids = [...fundHaken()];
  if (!ids.length || ungespeichert(ids)) return;
  mitName(von => tun(async () => {
    for (const id of ids) { await api(`/api/artikel/${aid}/freigeben`, { method: "POST", json: { fund_id: id, von } }); fundHaken().delete(id); }
  }, ids.length === 1 ? "Der Fund ist freigegeben und steht jetzt in der Datenbank." : `${ids.length} Funde sind freigegeben und stehen jetzt in der Datenbank.`));
}
function gewaehlteAblehnen(aid) {
  const ids = [...fundHaken()];
  if (!ids.length || ungespeichert(ids)) return;
  const grund = $("#ablehn-grund").value.trim() || "Fund passt nicht zum Artikel";
  document.activeElement.blur();
  mitName(von => tun(async () => {
    for (const id of ids) { await api(`/api/artikel/${aid}/ablehnen`, { method: "POST", json: { grund, von, fund_id: id } }); fundHaken().delete(id); }
    zustand.ablehnOffen = false;
  }, ids.length === 1 ? "Der Fund ist abgelehnt." : `${ids.length} Funde sind abgelehnt.`));
}
function pdfZeigen(url) { zustand.pdf = zustand.pdf === url ? null : url; zeichneArtikelSeite(); }

// ---------- e-mails: klassisches postfach mit projekt-wechsel links ----------
async function mailSeite(vid) {
  Object.assign(zustand, { seite: "mails", vid, v: null, mails: [], mailGewaehlt: null, projekte: [] });
  $("#app").innerHTML = `<div class="leer">Wird geladen …</div>`;
  const wache = seitenWache();
  await mailsLaden(true);
  seiteIntervall(() => mailsLaden(), 3000, wache);
}

async function mailsLaden(erstes = false) {
  if (eingabeAktiv()) return;
  const wache = seitenWache(), vid = zustand.vid;
  const hier = () => wache() && zustand.seite === "mails" && zustand.vid === vid;
  try {
    const [projekte, v, mails, einst] = await Promise.all([
      api("/api/vorgaenge"), api(`/api/vorgaenge/${vid}`), api(`/api/vorgaenge/${vid}/mails`),
      zustand.mailEinst ? zustand.mailEinst : api("/api/mail/einstellungen").catch(() => null),
    ]);
    if (!hier()) return;
    const geaendert = JSON.stringify(mails) !== JSON.stringify(zustand.mails) || JSON.stringify(projekte) !== JSON.stringify(zustand.projekte);
    zustand.projekte = projekte; zustand.v = v; zustand.mails = mails; zustand.mailEinst = einst;
    if (zustand.mailGewaehlt === null || !mails.some(m => m.id === zustand.mailGewaehlt)) {
      zustand.mailGewaehlt = mails[0]?.id ?? null;
    }
    if (erstes || geaendert) zeichnePostfach();
  } catch (e) {
    if (!hier()) return;
    if (erstes) $("#app").innerHTML = `<div class="karte unbelegt">Die E-Mails ließen sich nicht laden. ${esc(e.message)}</div>`;
    else $("#api-status").textContent = "Die Verbindung ist unterbrochen …";
  }
}

// Stand einer E-Mail in Worten (der Chip zeigt das Wort aus dem Vertrag)
const MAILSTAND = { entwurf: "Entwurf", gesendet: "gesendet", erinnert: "erinnert", eskaliert: "eskaliert" };
const ADRESSE_EINTRAGEN = `<a href="#/stammdaten/hersteller">Adresse in den Stammdaten eintragen</a>`;

function zeichnePostfach() {
  const v = zustand.v, mails = zustand.mails;
  zeichneNav();
  const artikel = Object.fromEntries(v.artikel.map(a => [a.id, a]));
  const einst = zustand.mailEinst;
  const ohneAdresse = mails.filter(m => m.status === "entwurf" && m.kontakt_fehlt).length;
  const mf = zustand.mailFilter || "alle";
  const sicht = mails.filter(m => mf === "alle" || m.status === mf);
  if (!sicht.some(m => m.id === zustand.mailGewaehlt)) zustand.mailGewaehlt = sicht[0]?.id ?? null;
  const zahl = s => mails.filter(m => m.status === s).length;
  $("#app").innerHTML = `
    <div class="kopfzeile">
      <div><a href="#/v/${v.id}" class="grau" style="text-decoration:none">← ${esc(v.name)}</a><h1>E-Mails an Hersteller</h1>
        <div class="grau">Jeden Entwurf geben Sie selbst frei. ${esc(einst?.satz || "Wohin die E-Mails in dieser Umgebung gehen, ließ sich gerade nicht feststellen.")}</div></div>
    </div>
    ${ohneAdresse ? `<div class="hinweis rot">${ohneAdresse === 1 ? "Für einen Entwurf fehlt" : `Für ${ohneAdresse} Entwürfe fehlt`} die E-Mail-Adresse des Herstellers. Solange sie fehlt, lässt sich der Entwurf nicht senden. ${ADRESSE_EINTRAGEN}</div>` : ""}
    <div class="filter mailfilter" role="group" aria-label="E-Mails nach Stand filtern">
      <button class="${mf === "alle" ? "an" : ""}" onclick="mailFiltern('alle')">Alle ${mails.length}</button>
      ${MAILFILTER.map(([s, text]) => `<button class="${mf === s ? "an" : ""}" onclick="mailFiltern('${s}')">${text} ${zahl(s)}</button>`).join("")}
    </div>
    <div class="post">
      <div class="ordner">
        <div class="titel">Vorgänge</div>
        ${zustand.projekte.map(p => `<a href="#/mails/${p.id}" class="${p.id === v.id ? "an" : ""}">
          <span>${esc(p.name)}</span>${p.zaehler.mail_entwurf ? `<span class="zahl">${p.zaehler.mail_entwurf}</span>` : ""}</a>`).join("")}
      </div>
      <div class="briefe">
        ${sicht.length ? sicht.map(m => {
          const a = artikel[m.artikel_id] || {};
          return `<div class="brief ${m.id === zustand.mailGewaehlt ? "an" : ""}" onclick="mailWaehlen(${m.id})">
            <div class="meta">${esc(m.empfaenger_hersteller || a.hersteller || m.an)}</div>
            <div class="betreff">${esc(m.betreff)}</div>
            <div class="meta">Position ${esc(a.pos)} · ${esc(a.bezeichnung)}${m.gesendet ? ` · ${esc(m.gesendet)}` : ""}</div>
            ${m.status === "entwurf" && m.kontakt_fehlt ? `<span class="marke-klein">E-Mail-Adresse fehlt</span>` : ""}
          </div>`;
        }).join("") : mails.length ? `<div class="leer">Keine E-Mail mit diesem Stand.</div>`
          : `<div class="leer">In diesem Vorgang gibt es noch keine E-Mails. Der Agent entwirft eine, wenn er nichts findet oder Sie einen Fund ablehnen.</div>`}
      </div>
      <div class="lesen" id="lesen"></div>
    </div>`;
  zeichneMail();
}

function mailWaehlen(mid) { zustand.mailGewaehlt = mid; zeichnePostfach(); }
// Filterleiste über der Liste; der Stand steht nicht mehr an jeder E-Mail
const MAILFILTER = [["entwurf", "Entwurf"], ["gesendet", "Gesendet"], ["erinnert", "Erinnert"], ["eskaliert", "Eskaliert"]];
function mailFiltern(s) { zustand.mailFilter = s; zeichnePostfach(); }

// „Empfänger: … In dieser Umgebung geht die E-Mail an …“
function empfaengerZeilen(m) {
  const einst = zustand.mailEinst, entwurf = m.status === "entwurf";
  if (m.kontakt_fehlt && entwurf) {
    return `<div class="feldzeile"><span class="grau">An</span><span><span class="unbelegt">Für diesen Hersteller ist noch keine E-Mail-Adresse hinterlegt.</span> ${ADRESSE_EINTRAGEN}</span></div>`;
  }
  const an = m.empfaenger_hersteller || m.an;
  const wohin = m.versand_an || m.an;
  const umgeleitet = wohin && an && wohin !== an;
  const testpostfach = einst?.versand === "testpostfach";
  const satz = !entwurf
    ? (umgeleitet ? `Gesendet wurde sie an ${wohin}${testpostfach ? " im Test-Postfach" : ""}.` : testpostfach ? "Sie liegt im Test-Postfach." : "")
    : umgeleitet ? `In dieser Umgebung geht die E-Mail an ${testpostfach ? "das Test-Postfach" : "die Testadresse"} ${wohin}.`
    : testpostfach ? "In dieser Umgebung landet die E-Mail im Test-Postfach." : "";
  return `<div class="feldzeile"><span class="grau">An</span><span>${esc(an)}${satz ? `<div class="grau" style="font-size:12px">${esc(satz)}</div>` : ""}</span></div>`;
}

function zeichneMail() {
  const m = zustand.mails.find(x => x.id === zustand.mailGewaehlt);
  if (!m) { $("#lesen").innerHTML = `<div class="leer">Wählen Sie links eine E-Mail aus.</div>`; return; }
  const a = zustand.v.artikel.find(x => x.id === m.artikel_id) || {};
  const entwurf = m.status === "entwurf";
  const gesperrt = entwurf && m.kontakt_fehlt;
  $("#lesen").innerHTML = `
    <div class="kopf">
      <div class="zeile"><strong>${entwurf ? "Entwurf" : "Gesendete E-Mail"}</strong></div>
      ${empfaengerZeilen(m)}
      ${entwurf ? `<label for="betreff-${m.id}">Betreff</label><input type="text" id="betreff-${m.id}" value="${esc(m.betreff)}" ${darfSchreiben() ? "" : "readonly"}>`
      : `<div class="feldzeile"><span class="grau">Betreff</span><span><strong>${esc(m.betreff)}</strong></span></div>
        ${m.gesendet ? `<div class="feldzeile"><span class="grau">Gesendet</span><span>${esc(m.gesendet)}</span></div>` : ""}
        ${m.erinnert ? `<div class="feldzeile"><span class="grau">Erinnert</span><span>${esc(m.erinnert)}</span></div>` : ""}`}
      <div class="feldzeile" style="margin-top:4px"><span class="grau">Grund</span><span class="grau">${esc(m.grund)} Es geht um <a href="#/v/${zustand.vid}/a/${m.artikel_id}">Position ${esc(a.pos)}, ${esc(a.bezeichnung)}</a>.</span></div>
    </div>
    ${entwurf ? `
      <label for="text-${m.id}">Text</label><textarea id="text-${m.id}" ${darfSchreiben() ? "" : "readonly"}>${esc(m.text)}</textarea>
      <div class="zeile" style="margin-top:10px">
        <button onclick="mailSenden(${m.id})" ${gesperrt ? `disabled title="Ohne E-Mail-Adresse des Herstellers lässt sich die E-Mail nicht senden."` : sperre()}>E-Mail freigeben und senden</button>
        <button class="leise" onclick="mailSpeichern(${m.id})" ${sperre()}>Entwurf speichern</button>${nameHinweis()}</div>
      ${gesperrt ? `<div class="unbelegt" style="margin-top:8px">Senden geht erst, wenn die E-Mail-Adresse des Herstellers hinterlegt ist. ${ADRESSE_EINTRAGEN}</div>` : ""}`
    : `<pre>${esc(m.text)}</pre>
      ${m.status !== "eskaliert" && a.status !== "zu_pruefen" && a.status !== "geprueft" ? `<div class="zeile nur-schreiben" style="margin-top:16px;border-top:1px solid var(--linie);padding-top:12px">
        <label for="antwort-${m.id}" style="margin:0">Antwort des Herstellers als PDF</label>${dateiwahl(`id="antwort-${m.id}" accept=".pdf"`)}
        <button class="leise" onclick="antwortEinfuegen(${m.id}, ${m.artikel_id})" ${sperre()}>Antwort einfügen</button>
        <button class="leise" onclick="erinnern(${m.id})" title="Die Frist zählt hier nicht. Der Schritt geschieht sofort." ${sperre()}>${m.erinnert ? "An den Einkauf eskalieren" : "Erinnerung senden"}</button>${nameHinweis()}</div>` : ""}`}`;
}

async function neuLaden() {
  if (zustand.seite === "artikel") await artikelLaden(true);
  else if (zustand.seite === "mails") await mailsLaden(true);
  else if (zustand.seite === "vorgang") await aktualisieren(zustand.vid, true);
  else await ladeProjekte(true);
}

// eine Aktion: die Meldung kommt immer, neu geladen wird nur, wenn die Seite noch dieselbe ist
async function tun(fn, ok) {
  const wache = seitenWache();
  try { await fn(); if (ok) toast(ok); if (wache()) await neuLaden(); }
  catch (e) { toast(e.message); }
}
// Vor dem Start: welche Sprachen braucht dieser Vorgang? Nur sie sucht der Agent.
function starten() {
  const s = zustand.v?.sprachen || { moeglich: [], gewaehlt: [] };
  startDialogZu();
  const el = document.createElement("div");
  el.className = "tg-schleier"; el.id = "start-dialog";
  el.innerHTML = `<div class="tg-dialog sprachwahl" role="dialog" aria-modal="true" aria-labelledby="start-titel" style="max-width:460px">
    <h2 id="start-titel">In welchen Sprachen brauchen Sie die Dokumente?</h2>
    <p class="grau" style="margin:0 0 6px;font-size:13px">Der Agent sucht nur Dokumente in den Sprachen, die Sie hier ankreuzen.</p>
    ${s.moeglich.map(x => `<label><input type="checkbox" value="${esc(x.kuerzel)}" ${s.gewaehlt.includes(x.kuerzel) ? "checked" : ""}> ${esc(x.name)}</label>`).join("")}
    <div id="start-fehler" class="unbelegt" role="alert"></div>
    <div class="zeile" style="margin-top:14px;justify-content:flex-end">
      <button class="leise" onclick="startDialogZu()">Abbrechen</button>
      <button id="start-los" onclick="startMitSprachen()">Agent starten</button>
    </div></div>`;
  el.addEventListener("mousedown", ev => { if (ev.target === el) startDialogZu(); });
  el.addEventListener("keydown", ev => { if (ev.key === "Escape") startDialogZu(); });
  document.body.appendChild(el);
  $("#start-los").focus();
}
function startDialogZu() { $("#start-dialog")?.remove(); }
function startMitSprachen() {
  const sprachen = [...document.querySelectorAll("#start-dialog input:checked")].map(x => x.value);
  if (!sprachen.length) { $("#start-fehler").textContent = "Bitte kreuzen Sie mindestens eine Sprache an."; return; }
  startDialogZu();
  startenMit(sprachen);
}
const startenMit = sprachen => tun(() => api(`/api/vorgaenge/${zustand.vid}/start`, { method: "POST", json: { sprachen } }), "Der Agent ist gestartet. Was er tut, zeigt der Knopf „Protokoll“.");
const maengelSenden = () => mitName(von => tun(() => api(`/api/vorgaenge/${zustand.vid}/maengel/senden`, { method: "POST", json: { von } }), "Die Mängelliste ist an den Einkauf gesendet."));
const freigeben = (aid, fid) => mitName(von => tun(() => api(`/api/artikel/${aid}/freigeben`, { method: "POST", json: { fund_id: fid, von, doc_type: $("#freigabe-art")?.value || undefined } }), "Der Fund ist freigegeben und steht jetzt in der Datenbank."));
function ablehnen(aid) {
  const grund = $("#ablehn-grund").value.trim() || "Fund passt nicht zum Artikel";
  document.activeElement.blur();
  mitName(von => tun(() => api(`/api/artikel/${aid}/ablehnen`, { method: "POST", json: { grund, von } }), "Der Fund ist abgelehnt."));
}
function zertifikatHochladen(aid, herkunft = "manuell", feld = "#zert-datei") {
  const f = $(feld)?.files[0];
  if (!f) return toast("Bitte wählen Sie zuerst ein PDF aus.");
  mitName(von => {
    const fd = new FormData(); fd.append("datei", f); fd.append("herkunft", herkunft); fd.append("von", von);
    return tun(() => api(`/api/artikel/${aid}/zertifikat`, { method: "POST", body: fd }), "Das Dokument ist eingefügt und wartet auf Ihre Prüfung.");
  });
}
const antwortEinfuegen = (mid, aid) => zertifikatHochladen(aid, "hersteller", `#antwort-${mid}`);
const mailDaten = mid => ({ betreff: $(`#betreff-${mid}`).value, text: $(`#text-${mid}`).value });
function mailSpeichern(mid) { const d = mailDaten(mid); document.activeElement.blur(); mitName(() => tun(() => api(`/api/mails/${mid}`, { method: "PUT", json: d }), "Der Entwurf ist gespeichert.")); }
function mailSenden(mid) {
  const d = mailDaten(mid); document.activeElement.blur();
  mitName(von => tun(async () => {
    await api(`/api/mails/${mid}`, { method: "PUT", json: d });
    const m = await api(`/api/mails/${mid}/senden`, { method: "POST", json: { von } });
    toast(m.versand_an && m.versand_an !== m.empfaenger_hersteller ? `Die E-Mail ist gesendet, in dieser Umgebung an ${m.versand_an}.` : "Die E-Mail ist gesendet.");
  }));
}
const erinnern = mid => mitName(von => tun(() => api(`/api/mails/${mid}/erinnern`, { method: "POST", json: { von } }), "Erledigt. Was genau geschehen ist, steht im Protokoll des Vorgangs."));

zeichneArtikelSeite = function () { if (eingabeAktiv()) return; _zeichneArtikelSeite(); abschnitte("artikel", zustand.a); };
