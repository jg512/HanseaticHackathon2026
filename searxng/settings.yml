# SearXNG-Einstellungen für die Internet-Suche des ATEX-Agents.
# use_default_settings erbt die mitgelieferten Standards (Engines, UI), hier wird nur
# das Nötigste überschrieben: Schlüssel, Ratenbegrenzung aus, HTML- und JSON-Ausgabe.
use_default_settings: true

server:
  # Platzhalter: vor jedem Betrieb außer der lokalen Entwicklung durch einen eigenen, zufälligen
  # Wert ersetzen, z. B. aus  python3 -c "import secrets; print(secrets.token_hex(32))"
  secret_key: "bitte-aendern-lokaler-platzhalter"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
