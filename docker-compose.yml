# Start: docker compose up --build
# Mit lokalem Sprachmodell (siehe .env.example):  docker compose --profile ollama up --build

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atex}
      POSTGRES_USER: ${POSTGRES_USER:-atex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atex}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-atex}:${POSTGRES_PASSWORD:-atex}@db:5432/${POSTGRES_DB:-atex}
      ATEX_DOCS: /data/ex_dokumente
      # Ähnlichkeitssuche: eigener Dienst, nicht Teil dieses Repositorys; leer = ohne diese Stufe
      SEARCH_URL: ${SEARCH_URL:-}
      # Ein Sprachmodell ohne Modelldatei (Beispielwerte); gefragt wird es nur mit
      # INTERNET_LLM=1 oder EMAIL_MIT_LLM=1. Leere Adresse = die des Anbieters
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4o-mini}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Mehrere Sprachmodelle aus config/modelle.yaml (config/README.md); ohne Datei gilt LLM_*.
      # Schlüssel für „api_key_env“ in der Datei kommen aus .env
      MODELLE_DATEI: /config/modelle.yaml
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # LiteLLM soll beim Start keine Preisliste aus dem Internet laden
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      # Postausgang: Standard ist Mailpit (Dienst „mail“), echtes Postfach über .env
      SMTP_HOST: ${SMTP_HOST:-mail}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_BENUTZER: ${SMTP_BENUTZER:-}
      SMTP_PASSWORT: ${SMTP_PASSWORT:-}
      SMTP_SICHERHEIT: ${SMTP_SICHERHEIT:-keine}
      MAIL_TEST_ADDRESS: ${MAIL_TEST_ADDRESS:-test@example.com}
      MAIL_FROM: ${MAIL_FROM:-atex-agent@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_ANTWORT_AN: ${MAIL_ANTWORT_AN:-}
      # 1 = Sprachmodell schreibt Anrede und Einleitung der E-Mail; 0 = feste Vorlage
      EMAIL_MIT_LLM: ${EMAIL_MIT_LLM:-0}
      INTERNET_VERSUCHE_PRO_TEIL: ${INTERNET_VERSUCHE_PRO_TEIL:-10}
      INTERNET_SUCH_URL: ${INTERNET_SUCH_URL:-http://searxng:8080/search?q={q}}
      # 1 = Sprachmodell wählt den passenden Link auf der Herstellerseite; 0 = nur Regeln
      INTERNET_LLM: ${INTERNET_LLM:-0}
      INTERNET_BROWSER: ${INTERNET_BROWSER:-1}
      WEBSUCHE_URL: ${WEBSUCHE_URL:-https://duckduckgo.com/?q={q}}
      ERINNERUNG_NACH_STUNDEN: ${ERINNERUNG_NACH_STUNDEN:-48}
      ERINNERUNGEN_MAX: ${ERINNERUNGEN_MAX:-1}
      EINKAUF_ADRESSE: ${EINKAUF_ADRESSE:-}
      SPRACHEN: ${SPRACHEN:-de,en}
      # Pflichtsprache der EU-Konformitätserklärung; SPRACHEN sind nur die gesuchten und gezeigten
      PFLICHTSPRACHE: ${PFLICHTSPRACHE:-de}
      # 1 = jede E-Mail an einen Hersteller geht an MAIL_TEST_ADDRESS (in dieser Umgebung nie 0)
      EMAIL_NUR_TEST: ${EMAIL_NUR_TEST:-1}
      # Vorprüfung: Hinweis, wenn ein Zertifikat in so vielen Tagen abläuft
      ABLAUF_WARNUNG_TAGE: ${ABLAUF_WARNUNG_TAGE:-180}
      AUTOMATISCH_FREIGEBEN: ${AUTOMATISCH_FREIGEBEN:-1}
      # ab dieser Ähnlichkeit (0 bis 1) gilt der Hersteller im Dokument als der der Stückliste
      HERSTELLER_AEHNLICHKEIT: ${HERSTELLER_AEHNLICHKEIT:-0.9}
      ZEITZONE: ${ZEITZONE:-Europe/Berlin}
      # Markierungen „veraltet“ je Datei; leer = Suche ohne Zertifikatsserver
      ZERTIFIKATSSERVER_URL: ${ZERTIFIKATSSERVER_URL:-http://zertifikatsserver:5100}
      # Adresse der Oberfläche im Browser; daraus die Archiv-Links der Kundenliste („DL-Link“)
      OEFFENTLICHE_ADRESSE: ${OEFFENTLICHE_ADRESSE:-http://localhost:${WEB_PORT:-8000}}
      # Texterkennung für Scans, läuft beim Start im Hintergrund; Ergebnisse im Volume ocr-cache
      OCR: ${OCR:-1}
      OCR_SPRACHEN: ${OCR_SPRACHEN:-deu+eng+fra}
      OCR_CACHE: /ocr
      # Anmeldung (docs/architektur.md, „Anmeldung“). Die Standardwerte sind NUR für die lokale
      # Entwicklung und die Demo; für jeden anderen Betrieb in .env ändern. Der Admin entsteht
      # beim Start, wenn es diesen Anmeldenamen noch nicht gibt; ein vorhandenes Konto bleibt.
      SECRET_KEY: ${SECRET_KEY:-entwicklung-nicht-geheim}
      SITZUNG_STUNDEN: ${SITZUNG_STUNDEN:-12}
      EX_LISTE: ${EX_LISTE:-}
      VERALTET_PRUEFUNG: ${VERALTET_PRUEFUNG:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      ADMIN_BENUTZER: ${ADMIN_BENUTZER:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORT: ${ADMIN_PASSWORT:-admin}
    volumes:
      - ./data/ex_dokumente:/data/ex_dokumente:ro
      # Zwischenspeicher für Funde aus dem Internet, als einziger Teil beschreibbar
      - ./data/ex_dokumente/_internet:/data/ex_dokumente/_internet
      # Von Hand hochgeladene Dokumente (manuell eingefügt, Antworten der Hersteller)
      - ./data/ex_dokumente/_upload:/data/ex_dokumente/_upload
      - ocr-cache:/ocr
      - ./config:/config:ro  # Sprachmodelle (config/modelle.yaml)
    ports:
      # nur auf diesem Rechner; andere Geräte erreichen die Anwendung über „web“
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started

  # Fängt alle E-Mails ab und zeigt sie unter http://localhost:8025, nichts geht nach draußen
  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Eigene Suchmaschine für die Internet-Suche: liefert Trefferlinks, die das Backend
  # dann auf der Herstellerseite weiterverfolgt (siehe INTERNET_SUCH_URL).
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "127.0.0.1:8080:8080"

  # Lokales Sprachmodell, nur mit --profile ollama (siehe .env.example)
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama

  # Zertifikatsserver (zertifikatsserver/README.md): eigene Datenbank und Ablage der PDFs,
  # Versionen je Teil, Verdacht „veraltet“. Liest beim ersten Start den alten Ordner ein.
  zertdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ZERT_DB:-zertifikate}
      POSTGRES_USER: ${ZERT_DB_USER:-zert}
      POSTGRES_PASSWORD: ${ZERT_DB_PASSWORD:-zert}
    volumes:
      - zert-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  zertifikatsserver:
    build: ./zertifikatsserver
    environment:
      DATABASE_URL: postgresql+psycopg://${ZERT_DB_USER:-zert}:${ZERT_DB_PASSWORD:-zert}@zertdb:5432/${ZERT_DB:-zertifikate}
      ABLAGE: /ablage
      ALTBESTAND: /altbestand
      HERSTELLER_NAMEN: ${HERSTELLER_NAMEN:-P+F=Pepperl+Fuchs}
      VERALTET_NACH_JAHREN: ${VERALTET_NACH_JAHREN:-10}
      # leer = nur die Vorgaben des Teams (zertifikatsserver/app/normen.py), alle „zu bestätigen“
      AKTUELLE_NORMEN: ${AKTUELLE_NORMEN:-}
      # Eigene Texterkennung für Scans, im Hintergrund nach dem Start; Ergebnisse in der Ablage (.ocr)
      OCR: ${OCR:-1}
      OCR_SPRACHEN: ${OCR_SPRACHEN:-deu+eng+fra}
      # größte Datei beim Hochladen (PDF, Office, Bilder, Zeichnungen, ZIP), nginx lässt 64 MB durch
      DATEI_MAX_MB: ${DATEI_MAX_MB:-50}
    volumes:
      # Altbestand nur lesend; die eigene Ablage (aktuell/, archiv/, .ocr/) liegt im Volume
      - ./data/ex_dokumente:/altbestand:ro
      - zert-ablage:/ablage
    ports:
      # nur auf diesem Rechner: der Server hat keine eigene Anmeldung, von außen nur über
      # nginx unter /zert/ (mit Anmeldung, web/nginx.conf)
      - "127.0.0.1:5100:5100"
    depends_on:
      zertdb:
        condition: service_healthy

  # Oberfläche (web/index.html) unter http://localhost:8000; reicht /api/ und /files/ an das
  # Backend weiter, die Seite braucht so keine eigene Backend-Adresse (web/README.md)
  web:
    image: nginx:1.28-alpine
    volumes:
      - ./web:/srv/web:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WEB_PORT:-8000}:80"
    depends_on:
      - backend

volumes:
  db-data:
  ocr-cache:
  ollama-data:
  zert-db-data:
  zert-ablage:
